<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kasyno 777</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .maszyna {
            background-color: #16213e;
            border: 5px solid #e94560;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }
        .bebny {
            display: flex;
            gap: 15px;
            margin: 20px 0;
        }
        .beben {
            width: 80px;
            height: 100px;
            background-color: #0f3460;
            border: 3px solid #ffd700;
            border-radius: 10px;
            font-size: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }
        /* Animacja trzęsienia podczas losowania */
        .krecenie {
            animation: wstrzas 0.1s infinite;
            filter: blur(2px);
        }
        @keyframes wstrzas {
            0% { transform: translateY(-5px); }
            50% { transform: translateY(5px); }
            100% { transform: translateY(-5px); }
        }
        button {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background-color: #ff2e63;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        #wynik {
            margin-top: 20px;
            font-size: 22px;
            height: 30px;
            color: #ffd700;
        }
    </style>
</head>
<body>

<div class="maszyna">
    <h1>🎰 KASYNO 777 🎰</h1>
    <div class="bebny">
        <div class="beben" id="b1">7</div>
        <div class="beben" id="b2">7</div>
        <div class="beben" id="b3">7</div>
    </div>
    <button id="przycisk" onclick="zagraj()">ZAKRĘĆ</button>
    <div id="wynik">Kliknij, aby zagrać!</div>
</div>

<script>
    const symbole = ['7️⃣', '🍒', '🍋', '💎', '🔔', '🍇'];
    
    function losujSymbol() {
        const indeks = Math.floor(Math.random() * symbole.length);
        return symbole[indeks];
    }

    function zagraj() {
        const przycisk = document.getElementById('przycisk');
        const wynikTekst = document.getElementById('wynik');
        const bebny = [
            document.getElementById('b1'),
            document.getElementById('b2'),
            document.getElementById('b3')
        ];

        // Blokujemy przycisk na czas animacji
        przycisk.disabled = true;
        wynikTekst.innerText = "Losowanie...";

        // Dodajemy klasę CSS odpowiedzialną za animację
        bebny.forEach(b => b.classList.add('krecenie'));

        // Symulacja szybkiej zmiany symboli (animacja)
        const interwal = setInterval(() => {
            bebny.forEach(b => b.innerText = losujSymbol());
        }, 80);

        // Zatrzymanie bębnów po 1.5 sekundy
        setTimeout(() => {
            clearInterval(interwal);
            bebny.forEach(b => b.classList.remove('krecenie'));

            // Ostateczne losowanie wyników
            const w1 = losujSymbol();
            const w2 = losujSymbol();
            const w3 = losujSymbol();

            bebny[0].innerText = w1;
            bebny[1].innerText = w2;
            bebny[2].innerText = w3;

            // Sprawdzanie wygranej
            if (w1 === w2 && w2 === w3) {
                if (w1 === '7️⃣') {
                    wynikTekst.innerText = "🎉 JACKPOT! TRZY SIÓDEMKI! 🎉";
                } else {
                    wynikTekst.innerText = "💰 WYGRANA! Trzy takie same! 💰";
                }
            } else {
                wynikTekst.innerText = "Spróbuj jeszcze raz!";
            }

            przycisk.disabled = false;
        }, 1500);
    }
</script>

</body>
</html>
