<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warcaby Online</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MQTT.js (WSS na porcie 443 - działa na GitHub Pages, LTE/5G oraz w sieciach szkolnych) -->
    <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
    <!-- Czcionka Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Stylizacja planszy 8x8 */
        .board-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            aspect-ratio: 1 / 1;
            width: 100%;
            max-width: min(88vw, 68vh, 520px);
            border: 10px solid #4a2e1b;
            border-radius: 12px;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.35), inset 0 0 0 2px #2c1a0e;
            overflow: hidden;
            background-color: #4a2e1b;
        }

        .square {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .square-light {
            background-color: #ebd5b3;
        }

        .square-dark {
            background-color: #8b5a2b;
        }

        /* Podświetlenia pól */
        .square-selected {
            background-color: #d97706 !important;
            box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.5);
        }

        .square-last-move {
            box-shadow: inset 0 0 0 3px rgba(250, 204, 21, 0.65);
        }

        .valid-move-dot {
            width: 32%;
            height: 32%;
            border-radius: 9999px;
            background-color: rgba(34, 197, 94, 0.85);
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.7);
            pointer-events: none;
            animation: pulseDot 1.4s infinite ease-in-out;
        }

        .valid-capture-ring {
            width: 78%;
            height: 78%;
            border-radius: 9999px;
            border: 4px solid rgba(239, 68, 68, 0.9);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
            pointer-events: none;
            animation: pulseDot 1.2s infinite ease-in-out;
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(0.95); opacity: 0.85; }
            50% { transform: scale(1.08); opacity: 1; }
        }

        /* Pionki */
        .piece {
            width: 78%;
            height: 78%;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease;
            position: relative;
            z-index: 10;
        }

        .piece-white {
            background: radial-gradient(circle at 32% 30%, #ffffff 0%, #f3f4f6 55%, #d1d5db 100%);
            border: 2px solid #9ca3af;
            box-shadow: 0 5px 0 #9ca3af, 0 8px 12px rgba(0, 0, 0, 0.35);
            color: #374151;
        }

        .piece-black {
            background: radial-gradient(circle at 32% 30%, #4b5563 0%, #1f2937 55%, #111827 100%);
            border: 2px solid #030712;
            box-shadow: 0 5px 0 #030712, 0 8px 12px rgba(0, 0, 0, 0.45);
            color: #fbbf24;
        }

        .piece-clickable {
            cursor: pointer;
        }

        .piece-clickable:hover {
            transform: translateY(-3px) scale(1.04);
        }

        .piece-must-capture {
            box-shadow: 0 0 0 3px #ef4444, 0 6px 12px rgba(0, 0, 0, 0.4);
        }

        /* Wewnętrzny pierścień pionka */
        .piece::after {
            content: '';
            position: absolute;
            width: 74%;
            height: 74%;
            border-radius: 9999px;
            border: 1.5px solid rgba(156, 163, 175, 0.45);
            pointer-events: none;
        }

        .piece-black::after {
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* Korona damki */
        .king-crown {
            width: 56%;
            height: 56%;
            z-index: 12;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.35));
        }

        /* Animacja pojawiania się */
        .fade-in {
            animation: fadeIn 0.25s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative overflow-x-hidden">

    <!-- LEWY GÓRNY RÓG: Nazwa konta oraz status "Grasz z [NAZWA]" -->
    <header class="fixed top-0 left-0 z-40 p-3 sm:p-4 flex flex-wrap items-center gap-3 max-w-full">
        <input
            type="text"
            id="my-name-input"
            maxlength="24"
            placeholder="Twoja nazwa konta"
            autocomplete="off"
            class="bg-white/95 backdrop-blur border border-gray-300 text-gray-800 text-sm sm:text-base font-medium rounded-xl px-3.5 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-600 focus:border-amber-600 w-44 sm:w-56 transition"
        />
        <!-- Wyświetlane TYLKO gdy przeciwnik jest połączony i wpisał niepustą nazwę -->
        <div id="opponent-name-badge" class="hidden bg-amber-900 text-amber-50 text-sm sm:text-base font-semibold px-3.5 py-2 rounded-xl shadow-sm fade-in">
            Grasz z <span id="opponent-name-text" class="font-bold underline decoration-amber-400"></span>
        </div>
    </header>

    <!-- Komunikat błędu / powiadomienie (zamiast alert()) -->
    <div id="toast-banner" class="hidden fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-red-600 text-white text-sm font-medium px-5 py-2.5 rounded-xl shadow-lg transition-all text-center max-w-[92vw]">
        <span id="toast-message"></span>
    </div>

    <!-- GŁÓWNA PRZESTRZEŃ ROBOCZA -->
    <main class="flex-1 flex flex-col items-center justify-center p-4 pt-20 pb-12 w-full">

        <!-- EKRAN 1: EKRAN STARTOWY (Logo + Warcaby Online + Wpisz kod | Albo | Stwórz Kod) -->
        <section id="screen-start" class="w-full max-w-xl flex flex-col items-center justify-center fade-in">

            <!-- LOGO PIONKA Z KORONĄ + NAPIS PO PRAWEJ: Warcaby (czarny) / Online (czerwony) -->
            <div class="flex items-center justify-center gap-4 sm:gap-5 mb-8 select-none">
                <!-- Ikona pionka szachowo-warcabowego -->
                <div class="w-16 h-16 sm:w-20 sm:h-20 bg-white border-2 border-gray-200 rounded-2xl shadow-md flex items-center justify-center p-2.5">
                    <svg viewBox="0 0 64 64" class="w-full h-full" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- Podstawa pionka -->
                        <rect x="12" y="50" width="40" height="7" rx="3.5" fill="#1f2937"/>
                        <path d="M16 50C16 44 21 41 24 39H40C43 41 48 44 48 50H16Z" fill="#374151"/>
                        <!-- Korpus pionka -->
                        <path d="M25 39L27 25H37L39 39H25Z" fill="#4b5563"/>
                        <!-- Kołnierz -->
                        <rect x="22" y="22" width="20" height="4" rx="2" fill="#1f2937"/>
                        <!-- Główka pionka -->
                        <circle cx="32" cy="14" r="8" fill="#1f2937"/>
                        <!-- Akcent korony damki -->
                        <path d="M27 7L29 10L32 6L35 10L37 7" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>

                <!-- Napis po prawej -->
                <div class="flex flex-col leading-none text-left">
                    <span class="text-4xl sm:text-5xl font-black tracking-tight text-gray-900">
                        Warcaby
                    </span>
                    <span class="text-2xl sm:text-3xl font-extrabold tracking-wide text-red-600 mt-1">
                        Online
                    </span>
                </div>
            </div>

            <!-- Rząd: Wpisz kod | Albo | Stwórz Kod -->
            <div class="flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-4 w-full">
                <!-- Pole: Wpisz kod -->
                <input
                    type="text"
                    id="join-code-input"
                    maxlength="10"
                    placeholder="Wpisz kod"
                    autocomplete="off"
                    class="w-full sm:w-48 text-center uppercase tracking-widest font-bold text-lg bg-white border-2 border-gray-300 text-gray-800 rounded-xl px-4 py-3 shadow-sm focus:outline-none focus:border-amber-600 focus:ring-2 focus:ring-amber-600/30 transition"
                />

                <!-- Separator: Albo -->
                <span class="text-gray-500 font-semibold text-base sm:text-lg px-1 select-none">
                    Albo
                </span>

                <!-- Guzik: Stwórz Kod -->
                <button
                    id="btn-create-code"
                    type="button"
                    class="w-full sm:w-auto bg-amber-700 hover:bg-amber-800 active:scale-[0.98] text-white font-bold text-lg px-6 py-3 rounded-xl shadow-md hover:shadow-lg transition cursor-pointer"
                >
                    Stwórz Kod
                </button>
            </div>

            <!-- Dynamiczny guzik "Dołącz" pojawiający się na dole po wpisaniu czegokolwiek w pole "Wpisz kod" -->
            <div id="join-button-wrapper" class="hidden mt-5 w-full sm:w-auto flex justify-center fade-in">
                <button
                    id="btn-join-game"
                    type="button"
                    class="w-full sm:w-56 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-bold text-lg px-8 py-3 rounded-xl shadow-md hover:shadow-lg transition cursor-pointer"
                >
                    Dołącz
                </button>
            </div>
        </section>

        <!-- EKRAN 2: TYLKO SAM WYGENEROWANY KOD (gdy kliknięto "Stwórz Kod", czekanie na 2. urządzenie) -->
        <section id="screen-code-only" class="hidden flex-col items-center justify-center text-center fade-in">
            <div
                id="generated-code-display"
                title="Kliknij, aby skopiować kod"
                class="text-6xl sm:text-8xl font-extrabold tracking-[0.18em] text-gray-900 bg-white border-2 border-gray-200 px-8 py-6 rounded-2xl shadow-md cursor-pointer hover:border-amber-500 active:scale-95 transition select-all"
            >
                ...
            </div>
            <p id="host-status-hint" class="mt-3 text-xs text-gray-400 font-medium transition-opacity">
                Rejestrowanie pokoju...
            </p>
        </section>

        <!-- EKRAN 3: PLANSZA GRY + SAFE CHAT PO PRAWEJ STRONIE -->
        <section id="screen-game" class="hidden flex-col lg:flex-row items-center lg:items-start justify-center gap-6 w-full max-w-5xl fade-in">

            <!-- LEWA / ŚRODKOWA KOLUMNA: Status tury + Szachownica + Koniec gry -->
            <div class="flex flex-col items-center justify-center w-full max-w-xl">
                <!-- Pasek statusu tury -->
                <div class="mb-4 flex flex-wrap items-center justify-center gap-3">
                    <div id="turn-indicator" class="px-5 py-2 rounded-full font-bold text-base sm:text-lg shadow-sm border transition-colors">
                        Twój ruch
                    </div>
                    <div id="player-color-badge" class="px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-semibold bg-white border border-gray-300 text-gray-700 shadow-sm">
                        Grasz: Białe
                    </div>
                </div>

                <!-- Szachownica 8x8 -->
                <div id="board" class="board-grid"></div>

                <!-- Panel końca gry (wygrana/przegrana + Zagraj ponownie) -->
                <div id="game-over-panel" class="hidden mt-5 bg-white border border-gray-200 rounded-2xl p-5 shadow-lg text-center max-w-sm w-full fade-in">
                    <h2 id="game-over-title" class="text-2xl font-extrabold text-gray-900 mb-1">Koniec gry!</h2>
                    <p id="game-over-subtitle" class="text-sm text-gray-600 mb-4"></p>
                    <button
                        id="btn-play-again"
                        type="button"
                        class="w-full bg-amber-700 hover:bg-amber-800 active:scale-[0.98] text-white font-bold py-3 px-6 rounded-xl shadow transition cursor-pointer"
                    >
                        Zagraj ponownie
                    </button>
                </div>
            </div>

            <!-- PRAWA KOLUMNA: SAFE CHAT (jak w starym Robloxie - wyłącznie gotowe słowa, zero własnego tekstu) -->
            <aside class="w-full max-w-md lg:w-72 bg-white border border-gray-200 rounded-2xl shadow-md p-4 flex flex-col lg:mt-12">
                <div class="flex items-center justify-between pb-2.5 mb-3 border-b border-gray-100">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                        <h3 class="text-sm font-extrabold uppercase tracking-wider text-gray-700">Safe Chat</h3>
                    </div>
                    <span class="text-[11px] font-semibold text-gray-400 bg-gray-100 px-2 py-0.5 rounded-md">Tylko gotowe słowa</span>
                </div>

                <!-- Historia wysłanych wiadomości Safe Chat -->
                <div id="safe-chat-messages" class="h-36 lg:h-52 overflow-y-auto flex flex-col gap-2 pr-1 mb-3 text-sm bg-gray-50 rounded-xl p-2.5 border border-gray-100">
                    <div class="text-xs text-gray-400 text-center my-auto select-none">
                        Kliknij słowo poniżej, aby wysłać
                    </div>
                </div>

                <!-- Gotowe przyciski fraz Safe Chat -->
                <div id="safe-chat-buttons" class="flex flex-wrap gap-1.5">
                    <button type="button" data-phrase="Hej" class="safe-chat-btn bg-gray-100 hover:bg-amber-100 hover:text-amber-900 active:scale-95 text-gray-800 font-semibold text-xs sm:text-sm px-3 py-1.5 rounded-xl border border-gray-200 transition cursor-pointer">Hej</button>
                    <button type="button" data-phrase="Siema" class="safe-chat-btn bg-gray-100 hover:bg-amber-100 hover:text-amber-900 active:scale-95 text-gray-800 font-semibold text-xs sm:text-sm px-3 py-1.5 rounded-xl border border-gray-200 transition cursor-pointer">Siema</button>
                    <button type="button" data-phrase="Nie" class="safe-chat-btn bg-gray-100 hover:bg-amber-100 hover:text-amber-900 active:scale-95 text-gray-800 font-semibold text-xs sm:text-sm px-3 py-1.5 rounded-xl border border-gray-200 transition cursor-pointer">Nie</button>
                    <button type="button" data-phrase="Tak" class="safe-chat-btn bg-gray-100 hover:bg-amber-100 hover:text-amber-900 active:scale-95 text-gray-800 font-semibold text-xs sm:text-sm px-3 py-1.5 rounded-xl border border-gray-200 transition cursor-pointer">Tak</button>
                    <button type="button" data-phrase="GG" class="safe-chat-btn bg-gray-100 hover:bg-amber-100 hover:text-amber-900 active:scale-95 text-gray-800 font-semibold text-xs sm:text-sm px-3 py-1.5 rounded-xl border border-gray-200 transition cursor-pointer">GG</button>
                    <button type="button" data-phrase="xd" class="safe-chat-btn bg-gray-100 hover:bg-amber-100 hover:text-amber-900 active:scale-95 text-gray-800 font-semibold text-xs sm:text-sm px-3 py-1.5 rounded-xl border border-gray-200 transition cursor-pointer">xd</button>
                    <button type="button" data-phrase="muszę kończyć" class="safe-chat-btn bg-gray-100 hover:bg-red-100 hover:text-red-900 active:scale-95 text-gray-800 font-semibold text-xs sm:text-sm px-3 py-1.5 rounded-xl border border-gray-200 transition cursor-pointer">muszę kończyć</button>
                </div>
            </aside>

        </section>

    </main>

    <!-- STOPKA NA DOLE MAŁYM DRUKIEM -->
    <footer class="w-full text-center py-3 text-xs text-gray-400 font-medium select-none">
        created by edimod
    </footer>

    <script>
        /**
         * WARCABY ONLINE MULTIPLAYER (MQTT over WSS port 443 + BroadcastChannel/localStorage)
         * Działa niezawodnie na GitHub Pages (HTTPS), telefonach (LTE/5G) i w sieciach szkolnych
         * bez problemów z blokowaniem UDP/WebRTC/TURN.
         */

        // --- KONFIGURACJA SIECIOWA (MQTT over Secure WebSockets port 443) ---
        const TOPIC_PREFIX = 'edimod-warcaby-2026/rooms/';
        const MQTT_BROKERS = [
            'wss://broker.emqx.io:8084/mqtt',
            'wss://broker.hivemq.com:8884/mqtt'
        ];
        const ALLOWED_SAFE_CHAT = ['Hej', 'Siema', 'Nie', 'Tak', 'GG', 'xd', 'muszę kończyć'];

        let mqttClient = null;
        let mqttConnected = false;
        let activeBrokerIndex = 0;

        let bc = null; // BroadcastChannel dla kart w tej samej przeglądarce
        let transportMode = null; // 'local' lub 'mqtt'
        const clientId = 'edimod_' + Math.random().toString(36).substring(2, 10) + '_' + Date.now().toString(36);

        let myRole = null; // 'white' (twórca kodu) lub 'black' (dołączający)
        let roomCode = '';
        let opponentClientId = '';
        let opponentName = '';
        let isPaired = false;

        let joinPingInterval = null;
        let joinTimeoutTimer = null;
        let heartbeatInterval = null;
        let lastOpponentSeenAt = 0;

        // Stan gry
        // Plansza 8x8: null lub obiekt { color: 'white' | 'black', king: boolean }
        let board = [];
        let currentTurn = 'white'; // 'white' zaczyna
        let selectedSquare = null; // { r, c }
        let validMoves = []; // Lista obiektów ruchu dla wybranego pionka
        let mustContinueCaptureFrom = null; // { r, c } podczas bicia wielokrotnego
        let lastMove = null; // { from: {r,c}, to: {r,c} }
        let gameOver = false;

        // --- ELEMENTY DOM ---
        const myNameInput = document.getElementById('my-name-input');
        const opponentNameBadge = document.getElementById('opponent-name-badge');
        const opponentNameText = document.getElementById('opponent-name-text');
        const toastBanner = document.getElementById('toast-banner');
        const toastMessage = document.getElementById('toast-message');

        const screenStart = document.getElementById('screen-start');
        const screenCodeOnly = document.getElementById('screen-code-only');
        const screenGame = document.getElementById('screen-game');

        const joinCodeInput = document.getElementById('join-code-input');
        const btnCreateCode = document.getElementById('btn-create-code');
        const joinButtonWrapper = document.getElementById('join-button-wrapper');
        const btnJoinGame = document.getElementById('btn-join-game');

        const generatedCodeDisplay = document.getElementById('generated-code-display');
        const hostStatusHint = document.getElementById('host-status-hint');

        const boardEl = document.getElementById('board');
        const turnIndicator = document.getElementById('turn-indicator');
        const playerColorBadge = document.getElementById('player-color-badge');
        const gameOverPanel = document.getElementById('game-over-panel');
        const gameOverTitle = document.getElementById('game-over-title');
        const gameOverSubtitle = document.getElementById('game-over-subtitle');
        const btnPlayAgain = document.getElementById('btn-play-again');

        const safeChatMessages = document.getElementById('safe-chat-messages');
        const safeChatButtons = document.querySelectorAll('.safe-chat-btn');

        // --- WARSTWA TRANSPORTOWA (MQTT WSS + LOKALNY KANAŁ PRZEGLĄDARKI) ---
        function isTransportOpen() {
            if (!isPaired) return false;
            if (transportMode === 'local') return true;
            return Boolean(mqttClient && mqttConnected);
        }

        function publishRoomPacket(payload, forceMode = null) {
            const mode = forceMode || transportMode;
            const packet = {
                sender: clientId,
                to: opponentClientId || null,
                room: roomCode,
                payload: payload,
                ts: Date.now(),
                nonce: Math.random()
            };

            if (mode === 'local' || !mode) {
                if (bc) {
                    try { bc.postMessage(packet); } catch (e) {}
                }
                try {
                    localStorage.setItem('warcaby_msg_' + roomCode, JSON.stringify(packet));
                } catch (e) {}
            }

            if ((mode === 'mqtt' || !mode) && mqttClient && mqttConnected && roomCode) {
                try {
                    mqttClient.publish(TOPIC_PREFIX + roomCode, JSON.stringify(packet), { qos: 1 });
                } catch (e) {}
            }
        }

        function cleanupConnections() {
            clearInterval(joinPingInterval);
            clearTimeout(joinTimeoutTimer);
            clearInterval(heartbeatInterval);

            if (bc) {
                try { bc.close(); } catch (e) {}
                bc = null;
            }
            if (mqttClient) {
                try { mqttClient.end(true); } catch (e) {}
                mqttClient = null;
            }
            mqttConnected = false;
            isPaired = false;
            opponentClientId = '';
        }

        // --- POWIADOMIENIA (ZAMIAST ALERT) ---
        let toastTimeout = null;
        function showToast(msg, isError = true) {
            toastMessage.textContent = msg;
            toastBanner.className = `fixed top-16 left-1/2 -translate-x-1/2 z-50 text-white text-sm font-semibold px-5 py-2.5 rounded-xl shadow-lg transition-all text-center max-w-[92vw] ${
                isError ? 'bg-red-600' : 'bg-emerald-600'
            }`;
            toastBanner.classList.remove('hidden');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastBanner.classList.add('hidden');
            }, 3800);
        }

        // --- ZARZĄDZANIE NAZWĄ KONTA W LEWYM GÓRNYM ROGU ---
        function updateOpponentNameUI() {
            const trimmed = (opponentName || '').trim();
            if (isPaired && trimmed.length > 0) {
                opponentNameText.textContent = trimmed;
                opponentNameBadge.classList.remove('hidden');
            } else {
                opponentNameBadge.classList.add('hidden');
                opponentNameText.textContent = '';
            }
        }

        function sendMyName() {
            if (isTransportOpen()) {
                publishRoomPacket({
                    type: 'NAME_UPDATE',
                    name: myNameInput.value.trim()
                });
            }
        }

        myNameInput.addEventListener('input', () => {
            sendMyName();
        });

        // --- SAFE CHAT (TYLKO DOZWOLONE FRAZY) ---
        function appendSafeChatMessage(phrase, isMine) {
            if (!ALLOWED_SAFE_CHAT.includes(phrase)) return;

            const placeholder = safeChatMessages.querySelector('.text-center');
            if (placeholder) {
                placeholder.remove();
            }

            const wrapper = document.createElement('div');
            wrapper.className = `flex flex-col ${isMine ? 'items-end' : 'items-start'} fade-in`;

            const senderLabel = document.createElement('span');
            senderLabel.className = 'text-[10px] font-semibold text-gray-400 mb-0.5 px-1';
            senderLabel.textContent = isMine ? 'Ty' : (opponentName.trim() || 'Przeciwnik');

            const bubble = document.createElement('div');
            bubble.className = isMine
                ? 'bg-amber-700 text-white font-semibold text-xs sm:text-sm px-3 py-1.5 rounded-2xl rounded-br-sm shadow-sm'
                : 'bg-white text-gray-800 font-semibold text-xs sm:text-sm px-3 py-1.5 rounded-2xl rounded-bl-sm border border-gray-200 shadow-sm';
            bubble.textContent = phrase;

            wrapper.appendChild(senderLabel);
            wrapper.appendChild(bubble);
            safeChatMessages.appendChild(wrapper);
            safeChatMessages.scrollTop = safeChatMessages.scrollHeight;
        }

        let chatCooldown = false;
        safeChatButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                if (chatCooldown || !isTransportOpen()) return;
                const phrase = btn.getAttribute('data-phrase');
                if (!ALLOWED_SAFE_CHAT.includes(phrase)) return;

                appendSafeChatMessage(phrase, true);
                publishRoomPacket({
                    type: 'SAFE_CHAT',
                    phrase: phrase
                });

                chatCooldown = true;
                setTimeout(() => { chatCooldown = false; }, 700);
            });
        });

        // --- GENEROWANIE KRÓTKIEGO CZYTELNEGO KODU (5 ZNAKÓW) ---
        function generateRoomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 5; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        // Kopiowanie kodu po kliknięciu w ekranie oczekiwania
        generatedCodeDisplay.addEventListener('click', () => {
            if (!roomCode || generatedCodeDisplay.textContent === '...') return;
            const tempInput = document.createElement('input');
            tempInput.value = roomCode;
            document.body.appendChild(tempInput);
            tempInput.select();
            try {
                document.execCommand('copy');

                hostStatusHint.classList.add('text-emerald-600');

                        hostStatusHint.classList.remove('text-emerald-600');

            document.body.removeChild(tempInput);

        // --- LOKALNY KANAŁ (BroadcastChannel + localStorage) DLA DWÓCH KART TEJ SAMEJ PRZEGLĄDARKI ---
        function setupLocalChannel(code) {
            const channelName = 'warcaby_room_' + code;
            const storageMsgKey = 'warcaby_msg_' + code;

            if ('BroadcastChannel' in window) {
                bc = new BroadcastChannel(channelName);
                bc.onmessage = (event) => {
                    handleIncomingPacket(event.data, 'local');
                };
            }

            window.addEventListener('storage', (event) => {
                if (event.key === storageMsgKey && event.newValue) {
                    try {
                        const packet = JSON.parse(event.newValue);
                        handleIncomingPacket(packet, 'local');
                    } catch (e) {}
                }
            });
        }

        // --- POŁĄCZENIE MQTT OVER SECURE WEBSOCKETS (WSS PORT 443) ---
        function connectMqttToRoom(code, onBrokerReady, onBrokerAllFailed) {
            if (typeof mqtt === 'undefined') {
                onBrokerAllFailed('Biblioteka sieciowa nie została załadowana (sprawdź internet).');
                return;
            }

            let brokerAttemptIndex = activeBrokerIndex;
            let attemptsCount = 0;

            const tryBroker = (idx) => {
                if (mqttClient) {
                    try { mqttClient.end(true); } catch (e) {}
                    mqttClient = null;
                }
                mqttConnected = false;

                const brokerUrl = MQTT_BROKERS[idx];
                const client = mqtt.connect(brokerUrl, {
                    clientId: clientId,
                    clean: true,
                    connectTimeout: 5500,
                    reconnectPeriod: 2000,
                    keepalive: 25
                });
                mqttClient = client;

                let opened = false;

                client.on('connect', () => {
                    if (mqttClient !== client) return;
                    opened = true;
                    mqttConnected = true;
                    activeBrokerIndex = idx;

                    client.subscribe(TOPIC_PREFIX + code, { qos: 1 }, (err) => {
                        if (err) {
                            onBrokerAllFailed('Błąd subskrypcji pokoju na serwerze.');
                            return;
                        }
                        if (onBrokerReady) onBrokerReady();
                    });
                });

                client.on('message', (topic, messageBuffer) => {
                    if (mqttClient !== client) return;
                    if (topic !== TOPIC_PREFIX + code) return;
                    try {
                        const packet = JSON.parse(messageBuffer.toString());
                        handleIncomingPacket(packet, 'mqtt');
                    } catch (e) {}
                });

                client.on('error', () => {
                    if (mqttClient !== client) return;
                    if (!opened) {
                        try { client.end(true); } catch (e) {}
                        attemptsCount++;
                        if (attemptsCount < MQTT_BROKERS.length) {
                            const nextIdx = (idx + 1) % MQTT_BROKERS.length;
                            tryBroker(nextIdx);
                        } else if (!isPaired) {
                            onBrokerAllFailed('Brak połączenia z serwerem gry (sprawdź internet lub sieć szkolną).');
                        }
                    }
                });

                client.on('offline', () => {
                    if (mqttClient === client) {
                        mqttConnected = false;
                    }
                });

                client.on('reconnect', () => {
                    if (mqttClient === client) {
                        mqttConnected = true;
                    }
                });
            };

            tryBroker(brokerAttemptIndex);
        }

        // --- PRZETWARZANIE PRZYCHODZĄCYCH PAKIETÓW (LOKALNYCH I MQTT) ---
        function handleIncomingPacket(packet, sourceMode) {
            if (!packet || packet.sender === clientId || packet.room !== roomCode) return;
            // Jeśli pakiet jest zaadresowany do konkretnego gracza, sprawdź czy to my
            if (packet.to && packet.to !== clientId) return;

            const data = packet.payload;
            if (!data || typeof data !== 'object') return;

            // 1. HOST (Biały) odbiera żądanie dołączenia od Gościa (Czarnego)
            if (myRole === 'white' && data.type === 'JOIN_REQUEST') {
                if (!isPaired) {
                    isPaired = true;
                    transportMode = sourceMode;
                    opponentClientId = packet.sender;
                    opponentName = data.name || '';
                    lastOpponentSeenAt = Date.now();

                    initBoardState();
                    publishRoomPacket({
                        type: 'WELCOME_SYNC',
                        board: board,
                        currentTurn: currentTurn,
                        name: myNameInput.value.trim()
                    }, sourceMode);

                    startHeartbeat();
                    updateOpponentNameUI();
                    startSyncedGameUI();
                } else if (packet.sender === opponentClientId) {
                    // Ponowne potwierdzenie dla tego samego gościa (gdyby pierwszy pakiet umknął)
                    publishRoomPacket({
                        type: 'WELCOME_SYNC',
                        board: board,
                        currentTurn: currentTurn,
                        name: myNameInput.value.trim()
                    }, transportMode);
                }
                return;
            }

            // 2. GOŚĆ (Czarny) odbiera potwierdzenie startu od Hosta (Białego)
            if (myRole === 'black' && !isPaired && data.type === 'WELCOME_SYNC') {
                isPaired = true;
                transportMode = sourceMode;
                opponentClientId = packet.sender;
                lastOpponentSeenAt = Date.now();

                clearInterval(joinPingInterval);
                clearTimeout(joinTimeoutTimer);
                resetJoinButton();

                startHeartbeat();
                sendMyName();
                handleIncomingGameData(data);
                return;
            }

            // 3. Pakiety w trakcie aktywnej partii od sparowanego przeciwnika
            if (isPaired && packet.sender === opponentClientId) {
                lastOpponentSeenAt = Date.now();
                handleIncomingGameData(data);
            }
        }

        function startHeartbeat() {
            clearInterval(heartbeatInterval);
            heartbeatInterval = setInterval(() => {
                if (isTransportOpen()) {
                    publishRoomPacket({ type: 'PING' });
                }
            }, 5000);
        }

        // --- TWORZENIE POKOJU (GRACZ BIAŁY - HOST) ---
        btnCreateCode.addEventListener('click', () => {
            btnCreateCode.disabled = true;
            cleanupConnections();

            myRole = 'white';

            showScreen('code');

            // 1. Kanał lokalny (dla 2 kart w jednej przeglądarce)
            setupLocalChannel(roomCode);

            // 2. Połączenie MQTT WSS na porcie 443 (dla 2 różnych urządzeń)
            connectMqttToRoom(
                roomCode,
                () => {
                    // Pokój w pełni zarejestrowany na brokerze HTTPS/WSS — teraz ujawniamy kod!
                    generatedCodeDisplay.textContent = roomCode;

                    btnCreateCode.disabled = false;
                },

                    generatedCodeDisplay.textContent = roomCode;
                    hostStatusHint.textContent = errMsg;
                    hostStatusHint.className = 'mt-3 text-xs text-red-500 font-semibold transition-opacity';

        // --- DOŁĄCZANIE DO POKOJU (GRACZ CZARNY - GUEST) ---
        btnJoinGame.addEventListener('click', () => {
            const rawCode = joinCodeInput.value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (!rawCode) return;

            cleanupConnections();
            btnJoinGame.disabled = true;
            btnJoinGame.textContent = 'Łączenie...';
            myRole = 'black';
            roomCode = rawCode;

            // 1. Kanał lokalny
            setupLocalChannel(roomCode);

            const sendJoinRequest = () => {
                if (isPaired) return;
                publishRoomPacket({
                    type: 'JOIN_REQUEST',
                    name: myNameInput.value.trim()
                });
            };

            // Natychmiastowa próba lokalna
            sendJoinRequest();

            // 2. Połączenie MQTT WSS na porcie 443
            connectMqttToRoom(
                roomCode,
                () => {
                    sendJoinRequest();
                    joinPingInterval = setInterval(() => {
                        if (!isPaired) {
                            sendJoinRequest();
                        } else {
                            clearInterval(joinPingInterval);
                        }
                    }, 1200);
                },
                (errMsg) => {
                    clearInterval(joinPingInterval);
                    clearTimeout(joinTimeoutTimer);
                    showToast(errMsg);
                    resetJoinButton();
                }
            );

            // Limit czasu (12 sekund) na odpowiedź pokoju
            joinTimeoutTimer = setTimeout(() => {
                clearInterval(joinPingInterval);
                if (!isPaired) {
                    showToast('Nie znaleziono pokoju o kodzie: ' + roomCode);
                    resetJoinButton();
                    cleanupConnections();
                }
            }, 12000);
        });

        function resetJoinButton() {
            btnJoinGame.disabled = false;
            btnJoinGame.textContent = 'Dołącz';
        }

        function handleIncomingGameData(data) {
            if (!data || typeof data !== 'object') return;

            switch (data.type) {
                case 'PING':
                    break;

                case 'NAME_UPDATE':
                    opponentName = data.name || '';
                    updateOpponentNameUI();
                    break;

                case 'SAFE_CHAT':
                    if (typeof data.phrase === 'string') {
                        appendSafeChatMessage(data.phrase, false);
                    }
                    break;

                case 'WELCOME_SYNC':
                    board = data.board;
                    currentTurn = data.currentTurn;
                    opponentName = data.name || '';
                    selectedSquare = null;
                    validMoves = [];
                    mustContinueCaptureFrom = null;
                    lastMove = null;
                    gameOver = false;
                    updateOpponentNameUI();
                    startSyncedGameUI();
                    break;

                case 'MOVE':
                    board = data.board;
                    currentTurn = data.currentTurn;
                    lastMove = data.lastMove;
                    gameOver = data.gameOver || false;
                    selectedSquare = null;
                    validMoves = [];
                    mustContinueCaptureFrom = null;
                    renderBoard();
                    updateTurnUI();
                    if (gameOver) {
                        showGameOver(data.winner);
                    }
                    break;

                case 'RESTART':
                    board = data.board;
                    currentTurn = data.currentTurn;
                    selectedSquare = null;
                    validMoves = [];
                    mustContinueCaptureFrom = null;
                    lastMove = null;
                    gameOver = false;
                    gameOverPanel.classList.add('hidden');
                    renderBoard();
                    updateTurnUI();
                    showToast('Rozpoczęto nową grę!', false);
                    break;
            }
        }

        function startSyncedGameUI() {
            gameOverPanel.classList.add('hidden');
            safeChatMessages.innerHTML = `
                <div class="text-xs text-gray-400 text-center my-auto select-none">
                    Kliknij słowo poniżej, aby wysłać
                </div>
            `;
            playerColorBadge.textContent = myRole === 'white' ? 'Grasz: Białe' : 'Grasz: Czarne';
            showScreen('game');
            renderBoard();
            updateTurnUI();
        }

        // --- INICJALIZACJA PLANSZY DO WARCABÓW (8x8) ---
        function initBoardState() {
            board = Array.from({ length: 8 }, () => Array(8).fill(null));
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 === 1) {
                        board[r][c] = { color: 'black', king: false };
                    }
                }
            }
            for (let r = 5; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 === 1) {
                        board[r][c] = { color: 'white', king: false };
                    }
                }
            }
            currentTurn = 'white';
            selectedSquare = null;
            validMoves = [];
            mustContinueCaptureFrom = null;
            lastMove = null;
            gameOver = false;
        }

        // --- ZASADY WARCABÓW KLASYCZNYCH (RUCHY, BICIA, DAMKI) ---
        function isInside(r, c) {
            return r >= 0 && r < 8 && c >= 0 && c < 8;
        }

        function getCapturesForPiece(r, c, boardState) {
            const piece = boardState[r][c];
            if (!piece) return [];
            const captures = [];
            const dirs = [
                [-1, -1], [-1, 1],
                [1, -1], [1, 1]
            ];

            if (!piece.king) {
                for (const [dr, dc] of dirs) {
                    const midR = r + dr;
                    const midC = c + dc;
                    const landR = r + 2 * dr;
                    const landC = c + 2 * dc;

                    if (isInside(landR, landC)) {
                        const midPiece = boardState[midR][midC];
                        const landPiece = boardState[landR][landC];
                        if (midPiece && midPiece.color !== piece.color && !landPiece) {
                            captures.push({
                                from: { r, c },
                                to: { r: landR, c: landC },
                                captured: { r: midR, c: midC }
                            });
                        }
                    }
                }
            } else {
                for (const [dr, dc] of dirs) {
                    let step = 1;
                    let enemyPos = null;

                    while (true) {
                        const currR = r + dr * step;
                        const currC = c + dc * step;
                        if (!isInside(currR, currC)) break;

                        const cell = boardState[currR][currC];
                        if (!enemyPos) {
                            if (!cell) {
                                step++;
                                continue;
                            } else if (cell.color === piece.color) {
                                break;
                            } else {
                                enemyPos = { r: currR, c: currC };
                                step++;
                            }
                        } else {
                            if (!cell) {
                                captures.push({
                                    from: { r, c },
                                    to: { r: currR, c: currC },
                                    captured: enemyPos
                                });
                                step++;
                            } else {
                                break;
                            }
                        }
                    }
                }
            }

            return captures;
        }

        function getRegularMovesForPiece(r, c, boardState) {
            const piece = boardState[r][c];
            if (!piece) return [];
            const moves = [];

            if (!piece.king) {
                const forwardDir = piece.color === 'white' ? -1 : 1;
                const dirs = [
                    [forwardDir, -1],
                    [forwardDir, 1]
                ];
                for (const [dr, dc] of dirs) {
                    const nr = r + dr;
                    const nc = c + dc;
                    if (isInside(nr, nc) && !boardState[nr][nc]) {
                        moves.push({
                            from: { r, c },
                            to: { r: nr, c: nc },
                            captured: null
                        });
                    }
                }
            } else {
                const dirs = [
                    [-1, -1], [-1, 1],
                    [1, -1], [1, 1]
                ];
                for (const [dr, dc] of dirs) {
                    let step = 1;
                    while (true) {
                        const nr = r + dr * step;
                        const nc = c + dc * step;
                        if (!isInside(nr, nc) || boardState[nr][nc]) break;
                        moves.push({
                            from: { r, c },
                            to: { r: nr, c: nc },
                            captured: null
                        });
                        step++;
                    }
                }
            }

            return moves;
        }

        function getAllLegalMovesForColor(color, boardState, forcedFrom = null) {
            let allCaptures = [];
            let allRegular = [];

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (forcedFrom && (forcedFrom.r !== r || forcedFrom.c !== c)) continue;
                    const piece = boardState[r][c];
                    if (piece && piece.color === color) {
                        const caps = getCapturesForPiece(r, c, boardState);
                        allCaptures.push(...caps);
                        if (!forcedFrom) {
                            const regs = getRegularMovesForPiece(r, c, boardState);
                            allRegular.push(...regs);
                        }
                    }
                }
            }

            if (allCaptures.length > 0) {
                return allCaptures;
            }
            return allRegular;
        }

        // --- INTERAKCJA Z PLANSZĄ ---
        function handleSquareClick(r, c) {
            if (gameOver || !isPaired) return;
            if (currentTurn !== myRole) return;

            const chosenMove = validMoves.find(m => m.to.r === r && m.to.c === c);
            if (chosenMove) {
                executeMove(chosenMove);
                return;
            }

            if (mustContinueCaptureFrom) {
                return;
            }

            const clickedPiece = board[r][c];
            if (clickedPiece && clickedPiece.color === myRole) {
                const legalMoves = getAllLegalMovesForColor(myRole, board);
                const pieceMoves = legalMoves.filter(m => m.from.r === r && m.from.c === c);

                if (pieceMoves.length > 0) {
                    selectedSquare = { r, c };
                    validMoves = pieceMoves;
                } else {
                    selectedSquare = { r, c };
                    validMoves = [];
                    const hasAnyCapture = legalMoves.some(m => m.captured !== null);
                    if (hasAnyCapture) {
                        showToast('Masz obowiązkowe bicie innym pionkiem!');
                    }
                }
                renderBoard();
            } else {
                selectedSquare = null;
                validMoves = [];
                renderBoard();
            }
        }

        function executeMove(move) {
            const { from, to, captured } = move;
            const piece = board[from.r][from.c];

            board[to.r][to.c] = piece;
            board[from.r][from.c] = null;

            if (captured) {
                board[captured.r][captured.c] = null;
            }

            lastMove = { from, to };

            if (captured) {
                const nextCaptures = getCapturesForPiece(to.r, to.c, board);
                if (nextCaptures.length > 0) {
                    mustContinueCaptureFrom = { r: to.r, c: to.c };
                    selectedSquare = { r: to.r, c: to.c };
                    validMoves = nextCaptures;
                    renderBoard();

                    if (isTransportOpen()) {
                        publishRoomPacket({
                            type: 'MOVE',
                            board: board,
                            currentTurn: currentTurn,
                            lastMove: lastMove,
                            gameOver: false
                        });
                    }
                    return;
                }
            }

            if (!piece.king) {
                if (piece.color === 'white' && to.r === 0) {
                    piece.king = true;
                } else if (piece.color === 'black' && to.r === 7) {
                    piece.king = true;
                }
            }

            mustContinueCaptureFrom = null;
            selectedSquare = null;
            validMoves = [];
            currentTurn = myRole === 'white' ? 'black' : 'white';

            const opponentMoves = getAllLegalMovesForColor(currentTurn, board);
            let winner = null;
            if (opponentMoves.length === 0) {
                gameOver = true;
                winner = myRole;
            }

            renderBoard();
            updateTurnUI();

            if (isTransportOpen()) {
                publishRoomPacket({
                    type: 'MOVE',
                    board: board,
                    currentTurn: currentTurn,
                    lastMove: lastMove,
                    gameOver: gameOver,
                    winner: winner
                });
            }

            if (gameOver) {
                showGameOver(winner);
            }
        }

        // --- RENDEROWANIE SZACHOWNICY ---
        function renderBoard() {
            boardEl.innerHTML = '';

            const mandatoryCaptureSquares = new Set();
            if (!gameOver && currentTurn === myRole) {
                const legalMoves = getAllLegalMovesForColor(myRole, board, mustContinueCaptureFrom);
                legalMoves.forEach(m => {
                    if (m.captured) {
                        mandatoryCaptureSquares.add(`${m.from.r},${m.from.c}`);
                    }
                });
            }

            const rowIndices = myRole === 'black' ? [7, 6, 5, 4, 3, 2, 1, 0] : [0, 1, 2, 3, 4, 5, 6, 7];
            const colIndices = myRole === 'black' ? [7, 6, 5, 4, 3, 2, 1, 0] : [0, 1, 2, 3, 4, 5, 6, 7];

            for (const r of rowIndices) {
                for (const c of colIndices) {
                    const square = document.createElement('div');
                    const isDark = (r + c) % 2 === 1;
                    square.className = `square ${isDark ? 'square-dark' : 'square-light'}`;

                    if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
                        square.classList.add('square-selected');
                    }

                    if (lastMove && ((lastMove.from.r === r && lastMove.from.c === c) || (lastMove.to.r === r && lastMove.to.c === c))) {
                        square.classList.add('square-last-move');
                    }

                    const validMoveHere = validMoves.find(m => m.to.r === r && m.to.c === c);
                    if (validMoveHere) {
                        const marker = document.createElement('div');
                        marker.className = validMoveHere.captured ? 'valid-capture-ring' : 'valid-move-dot';
                        square.appendChild(marker);
                    }

                    const piece = board[r][c];
                    if (piece) {
                        const pieceEl = document.createElement('div');
                        pieceEl.className = `piece ${piece.color === 'white' ? 'piece-white' : 'piece-black'}`;

                        if (!gameOver && currentTurn === myRole && piece.color === myRole) {
                            pieceEl.classList.add('piece-clickable');
                        }

                        if (mandatoryCaptureSquares.has(`${r},${c}`)) {
                            pieceEl.classList.add('piece-must-capture');
                        }

                        if (piece.king) {
                            pieceEl.innerHTML = `
                                <svg class="king-crown" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/>
                                </svg>
                            `;
                        }

                        square.appendChild(pieceEl);
                    }

                    square.addEventListener('click', () => handleSquareClick(r, c));
                    boardEl.appendChild(square);
                }
            }
        }

        // --- AKTUALIZACJA WSKAŹNIKA TURY ---
        function updateTurnUI() {
            if (gameOver) {
                turnIndicator.textContent = 'Koniec partii';
                turnIndicator.className = 'px-5 py-2 rounded-full font-bold text-base sm:text-lg shadow-sm border bg-gray-200 text-gray-800 border-gray-300';
                return;
            }

            if (currentTurn === myRole) {
                turnIndicator.textContent = mustContinueCaptureFrom ? 'Twój ruch (bij dalej!)' : 'Twój ruch';
                turnIndicator.className = 'px-5 py-2 rounded-full font-bold text-base sm:text-lg shadow-sm border bg-emerald-600 text-white border-emerald-700';
            } else {
                turnIndicator.textContent = 'Ruch przeciwnika';
                turnIndicator.className = 'px-5 py-2 rounded-full font-bold text-base sm:text-lg shadow-sm border bg-white text-gray-700 border-gray-300';
            }
        }

        // --- EKRAN KOŃCA GRY I RESTART ---
        function showGameOver(winner) {
            gameOverPanel.classList.remove('hidden');
            if (winner === myRole) {
                gameOverTitle.textContent = 'Wygrałeś! 🎉';
                gameOverSubtitle.textContent = 'Gratulacje, świetna partia warcabów!';
            } else {
                gameOverTitle.textContent = 'Przegrałeś';
                gameOverSubtitle.textContent = 'Przeciwnik wygrał tę partię.';
            }
        }

        btnPlayAgain.addEventListener('click', () => {
            if (!isTransportOpen()) {
                showToast('Brak połączenia z przeciwnikiem.');
                return;
            }
            initBoardState();
            gameOverPanel.classList.add('hidden');
            renderBoard();
            updateTurnUI();

            publishRoomPacket({
                type: 'RESTART',
                board: board,
                currentTurn: currentTurn
            });
        });
    </script>
</body>
</html>
