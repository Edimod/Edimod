<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Przekierowanie — Edimod</title>
    <style>
        body {
            background: #0b0d14;
            color: #f8fafc;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive, sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .box {
            max-width: 480px;
            background: #121726;
            border: 2px dashed #e879f9;
            border-radius: 16px;
            padding: 28px;
        }
        code {
            display: inline-block;
            margin: 12px 0;
            padding: 8px 12px;
            background: #090c14;
            color: #fde047;
            border-radius: 8px;
        }
        a {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 18px;
            background: #9333ea;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🕵️ Nie tędy, piracie!</h1>
        <p>Aby wejść na czarny rynek, wejdź na <strong>czarny-rynek.html</strong> lub wpisz w pasek adresu:</p>
        <code>edimod.github.io/Edimod/czarny-rynek.html</code>
        <div>
            <a href="czarny-rynek.html">Przejdź do czarny-rynek.html</a>
        </div>
    </div>
</body>
</html>
