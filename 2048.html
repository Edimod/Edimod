<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 - Edimod games</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
            background-color: #faf8ef;
            color: #776e65;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .header {
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 50px;
            font-weight: bold;
            margin: 0;
            color: #776e65;
        }

        .scores-container {
            display: flex;
            gap: 10px;
        }

        .score-box {
            background-color: #bbada0;
            color: white;
            padding: 5px 15px;
            border-radius: 6px;
            text-align: center;
            min-width: 70px;
        }

        .score-box .label {
            font-size: 11px;
            text-transform: uppercase;
            color: #eee4da;
        }

        .score-box .value {
            font-size: 20px;
            font-weight: bold;
        }

        .controls {
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .controls p {
            margin: 0;
            font-size: 14px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .restart-btn, .merge-btn, .resume-btn {
            background-color: #8f7a66;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .restart-btn:hover, .merge-btn:hover, .resume-btn:hover {
            background-color: #9f8b77;
        }

        .merge-btn {
            background-color: #edc22e;
            color: #3c3a32;
        }

        .merge-btn:hover {
            background-color: #e0b422;
        }

        .resume-btn {
            background-color: #2f9e44;
            color: #ffffff;
            display: none;
        }

        .resume-btn:hover {
            background-color: #2b8a3e;
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 450px;
            background-color: #bbada0;
            border-radius: 8px;
            padding: 15px;
            touch-action: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 15px;
            width: 100%;
            height: 100%;
        }

        .grid-cell {
            background-color: rgba(238, 228, 218, 0.35);
            border-radius: 6px;
        }

        .tile-container {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 420px;
            height: 420px;
            pointer-events: none;
        }

        .game-container.picking-mode .tile-container {
            pointer-events: auto;
        }

        .game-container.picking-mode .tile {
            cursor: pointer;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.7);
        }

        .game-container.picking-mode .tile:hover {
            filter: brightness(1.08);
        }

        .game-container.picking-mode .tile.selected-tile {
            box-shadow: 0 0 0 4px #2f9e44;
            filter: brightness(1.12);
        }

        .tile {
            position: absolute;
            width: 93.75px;
            height: 93.75px;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            transition: transform 0.15s ease-in-out;
            will-change: transform;
        }

        .tile-new {
            animation: appear 0.2s ease-in-out;
        }

        @keyframes appear {
            0% { opacity: 0; transform: scale(0); }
            100% { opacity: 1; transform: scale(1); }
        }

        .tile-merged {
            animation: pulse 0.15s ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* Kolory kafelków */
        .tile-2 { background: #eee4da; color: #776e65; }
        .tile-4 { background: #ede0c8; color: #776e65; }
        .tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile-16 { background: #f59563; color: #f9f6f2; }
        .tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 28px; }
        .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 28px; }
        .tile-512 { background: #edc850; color: #f9f6f2; font-size: 28px; }
        .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 22px; }
        .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 22px; }
        .tile-super { background: #3c3a32; color: #f9f6f2; font-size: 18px; }

        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(238, 228, 218, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            z-index: 10;
            gap: 12px;
            padding: 20px;
            text-align: center;
        }

        .game-over p {
            font-size: 36px;
            font-weight: bold;
            color: #776e65;
            margin: 0;
        }

        .game-over-sub {
            font-size: 15px;
            color: #776e65;
            margin: 0 0 6px 0;
            max-width: 320px;
        }

        .game-over-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        footer {
            margin-top: 20px;
            font-size: 14px;
            font-weight: bold;
            color: #776e65;
            text-align: center;
        }

        @media (max-width: 480px) {
            .game-container {
                height: 320px;
                padding: 10px;
            }
            .tile-container {
                top: 10px;
                left: 10px;
                width: 300px;
                height: 300px;
            }
            .grid {
                gap: 10px;
            }
            .tile {
                width: 67.5px;
                height: 67.5px;
                font-size: 22px;
            }
            .tile-128, .tile-256, .tile-512 { font-size: 18px; }
            .tile-1024, .tile-2048 { font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="header">
            <h1>2048</h1>
            <div class="scores-container">
                <div class="score-box">
                    <div class="label">Wynik</div>
                    <div class="value" id="score">0</div>
                </div>
                <div class="score-box">
                    <div class="label">Rekord</div>
                    <div class="value" id="best">0</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <p id="status-text">Połącz kafelki, aby zdobyć <strong>2048!</strong></p>
            <div class="btn-group">
                <button class="resume-btn" id="resume-btn" onclick="stopPickingTiles()">Graj dalej</button>
                <button class="restart-btn" onclick="initGame()">Nowa gra</button>
            </div>
        </div>

        <div class="game-container" id="game-container">
            <div class="grid">
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            </div>
            <div class="tile-container" id="tile-container"></div>
            <div class="game-over" id="game-over">
                <p id="game-over-title">Koniec gry!</p>
                <p class="game-over-sub" id="game-over-sub"></p>
                <div class="game-over-actions">
                    <button class="merge-btn" id="merge-btn" onclick="startPickingTiles()">Połącz bloki</button>
                    <button class="restart-btn" onclick="initGame()">Spróbuj ponownie</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        Edimod games © 2026
    </footer>

    <script>
        const SIZE = 4;
        let board = [];
        let tiles = [];
        let score = 0;
        let bestScore = localStorage.getItem('bestScore') || 0;
        let nextId = 1;
        let isAnimating = false;
        let isPickingTiles = false;
        let firstSelectedTileId = null;

        document.getElementById('best').innerText = bestScore;

        function initGame() {
            board = Array(SIZE).fill(null).map(() => Array(SIZE).fill(null));
            tiles = [];
            score = 0;
            isPickingTiles = false;
            firstSelectedTileId = null;
            updateScore(0);
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('game-container').classList.remove('picking-mode');
            document.getElementById('resume-btn').style.display = 'none';
            document.getElementById('status-text').innerHTML = 'Połącz kafelki, aby zdobyć <strong>2048!</strong>';
            document.getElementById('tile-container').innerHTML = '';
            nextId = 1;

            addRandomTile(true);
            addRandomTile(true);
            render();
        }

        function hasAnyMatchingPair() {
            const counts = new Map();
            for (const tile of tiles) {
                if (tile.toDelete) continue;
                counts.set(tile.value, (counts.get(tile.value) || 0) + 1);
            }
            for (const count of counts.values()) {
                if (count >= 2) return true;
            }
            return false;
        }

        function triggerGameOverScreen() {
            isPickingTiles = false;
            firstSelectedTileId = null;
            document.getElementById('game-container').classList.remove('picking-mode');
            document.getElementById('resume-btn').style.display = 'none';
            document.getElementById('status-text').innerHTML = 'Połącz kafelki, aby zdobyć <strong>2048!</strong>';

            const canMergeAny = hasAnyMatchingPair();
            const titleEl = document.getElementById('game-over-title');
            const subEl = document.getElementById('game-over-sub');
            const mergeBtn = document.getElementById('merge-btn');

            if (canMergeAny) {
                titleEl.innerText = 'Koniec gry!';
                subEl.innerText = 'Brak ruchów, ale możesz połączyć dwa takie same bloki z planszy.';
                mergeBtn.style.display = 'inline-block';
            } else {
                titleEl.innerText = 'Pełny Game Over!';
                subEl.innerText = 'Brak ruchów i brak dwóch bloków o tej samej wartości do połączenia.';
                mergeBtn.style.display = 'none';
            }

            document.getElementById('game-over').style.display = 'flex';
            render();
        }

        function startPickingTiles() {
            if (!hasAnyMatchingPair()) {
                triggerGameOverScreen();
                return;
            }
            isPickingTiles = true;
            firstSelectedTileId = null;
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('game-container').classList.add('picking-mode');
            document.getElementById('resume-btn').style.display = 'inline-block';
            document.getElementById('status-text').innerHTML = 'Łączenie: wybierz <strong>pierwszy blok</strong> lub kliknij <strong>Graj dalej</strong>.';
            render();
        }

        function stopPickingTiles() {
            isPickingTiles = false;
            firstSelectedTileId = null;
            document.getElementById('game-container').classList.remove('picking-mode');
            document.getElementById('resume-btn').style.display = 'none';
            document.getElementById('status-text').innerHTML = 'Połącz kafelki, aby zdobyć <strong>2048!</strong>';
            render();
        }

        function handleTileClick(tileId) {
            if (!isPickingTiles) return;

            const clickedTile = tiles.find(t => t.id === tileId && !t.toDelete);
            if (!clickedTile) return;

            if (firstSelectedTileId === null) {
                firstSelectedTileId = tileId;
                document.getElementById('status-text').innerHTML = `Wybrano <strong>${clickedTile.value}</strong> — kliknij drugi blok <strong>${clickedTile.value}</strong>.`;
                render();
                return;
            }

            if (firstSelectedTileId === tileId) {
                firstSelectedTileId = null;
                document.getElementById('status-text').innerHTML = 'Odznaczono — wybierz <strong>pierwszy blok</strong> lub kliknij <strong>Graj dalej</strong>.';
                render();
                return;
            }

            const firstTile = tiles.find(t => t.id === firstSelectedTileId && !t.toDelete);
            if (!firstTile) {
                firstSelectedTileId = tileId;
                render();
                return;
            }

            if (firstTile.value !== clickedTile.value) {
                document.getElementById('status-text').innerHTML = `Wybierz blok o tej samej wartości (<strong>${firstTile.value}</strong>).`;
                return;
            }

            // Łączymy pierwszy blok z drugim wybranym blokiem
            const newValue = firstTile.value * 2;
            if (board[firstTile.r] && board[firstTile.r][firstTile.c] && board[firstTile.r][firstTile.c].id === firstTile.id) {
                board[firstTile.r][firstTile.c] = null;
            }

            clickedTile.value = newValue;
            board[clickedTile.r][clickedTile.c] = clickedTile;
            tiles = tiles.filter(t => t.id !== firstTile.id);

            const firstEl = document.getElementById(`tile-${firstTile.id}`);
            if (firstEl) firstEl.remove();

            updateScore(newValue);
            firstSelectedTileId = null;

            render();

            const targetEl = document.getElementById(`tile-${clickedTile.id}`);
            if (targetEl) {
                targetEl.classList.remove('tile-merged');
                void targetEl.offsetWidth;
                targetEl.classList.add('tile-merged');
            }

            // Po połączeniu sprawdzamy, czy są jeszcze jakieś pary do łączenia
            if (!hasAnyMatchingPair()) {
                if (checkGameOver()) {
                    triggerGameOverScreen();
                } else {
                    stopPickingTiles();
                }
            } else {
                document.getElementById('status-text').innerHTML = 'Połączono! Możesz połączyć <strong>kolejne bloki</strong> lub kliknąć <strong>Graj dalej</strong>.';
            }
        }

        function addRandomTile(isInitial = false) {
            let emptyCells = [];
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (!board[r][c]) {
                        emptyCells.push({ r, c });
                    }
                }
            }
            if (emptyCells.length > 0) {
                let cell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                let tile = {
                    id: nextId++,
                    value: Math.random() < 0.9 ? 2 : 4,
                    r: cell.r,
                    c: cell.c,
                    isNew: !isInitial,
                    mergedInto: null,
                    toDelete: false
                };
                board[cell.r][cell.c] = tile;
                tiles.push(tile);
            }
        }

        function getStepSize() {
            return window.innerWidth <= 480 ? 77.5 : 108.75;
        }

        function render() {
            const container = document.getElementById('tile-container');
            const step = getStepSize();

            // Usunięcie kafelków przeznaczonych do kasacji z DOM
            tiles.filter(t => t.toDelete).forEach(t => {
                let el = document.getElementById(`tile-${t.id}`);
                if (el) el.remove();
            });
            tiles = tiles.filter(t => !t.toDelete);

            tiles.forEach(tile => {
                let el = document.getElementById(`tile-${tile.id}`);
                if (!el) {
                    el = document.createElement('div');
                    el.id = `tile-${tile.id}`;
                    el.addEventListener('click', () => handleTileClick(tile.id));
                    container.appendChild(el);
                    if (tile.isNew) {
                        el.classList.add('tile-new');
                    }
                }

                let valClass = tile.value <= 2048 ? `tile-${tile.value}` : 'tile-super';
                const isSelected = isPickingTiles && tile.id === firstSelectedTileId;
                el.className = `tile ${valClass}${isSelected ? ' selected-tile' : ''}`;
                el.innerText = tile.value;
                el.style.transform = `translate(${tile.c * step}px, ${tile.r * step}px)`;
            });
        }

        function updateScore(amount) {
            score += amount;
            document.getElementById('score').innerText = score;
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('bestScore', bestScore);
                document.getElementById('best').innerText = bestScore;
            }
        }

        function move(direction) {
            if (isAnimating || isPickingTiles) return;

            let moved = false;
            let addedScore = 0;

            tiles.forEach(t => {
                t.isNew = false;
                t.mergedInto = null;
            });

            let vR = direction === 'up' ? -1 : direction === 'down' ? 1 : 0;
            let vC = direction === 'left' ? -1 : direction === 'right' ? 1 : 0;

            let rows = [0, 1, 2, 3];
            let cols = [0, 1, 2, 3];

            if (direction === 'down') rows.reverse();
            if (direction === 'right') cols.reverse();

            let newBoard = Array(SIZE).fill(null).map(() => Array(SIZE).fill(null));

            rows.forEach(r => {
                cols.forEach(c => {
                    let tile = board[r][c];
                    if (tile) {
                        let curR = r;
                        let curC = c;

                        while (true) {
                            let nextR = curR + vR;
                            let nextC = curC + vC;

                            if (nextR < 0 || nextR >= SIZE || nextC < 0 || nextC >= SIZE) break;

                            let nextTile = newBoard[nextR][nextC];
                            if (!nextTile) {
                                curR = nextR;
                                curC = nextC;
                            } else if (nextTile.value === tile.value && !nextTile.mergedInto && !nextTile.toDelete) {
                                curR = nextR;
                                curC = nextC;
                                break;
                            } else {
                                break;
                            }
                        }

                        let targetTile = newBoard[curR][curC];
                        if (targetTile && targetTile.value === tile.value && !targetTile.mergedInto) {
                            tile.r = curR;
                            tile.c = curC;
                            tile.toDelete = true;

                            targetTile.value *= 2;
                            targetTile.mergedInto = true;
                            addedScore += targetTile.value;
                            moved = true;
                        } else {
                            if (tile.r !== curR || tile.c !== curC) {
                                moved = true;
                            }
                            tile.r = curR;
                            tile.c = curC;
                            newBoard[curR][curC] = tile;
                        }
                    }
                });
            });

            if (moved) {
                isAnimating = true;
                board = newBoard;
                updateScore(addedScore);
                render();

                setTimeout(() => {
                    tiles = tiles.filter(t => !t.toDelete);
                    board = Array(SIZE).fill(null).map(() => Array(SIZE).fill(null));
                    tiles.forEach(t => board[t.r][t.c] = t);

                    addRandomTile();
                    render();
                    isAnimating = false;

                    if (checkGameOver()) {
                        triggerGameOverScreen();
                    }
                }, 160);
            }
        }

        function checkGameOver() {
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (!board[r][c]) return false;
                    let val = board[r][c].value;
                    if (c < SIZE - 1 && board[r][c + 1] && board[r][c + 1].value === val) return false;
                    if (r < SIZE - 1 && board[r + 1][c] && board[r + 1][c].value === val) return false;
                }
            }
            return true;
        }

        // Sterowanie klawiaturą
        document.addEventListener('keydown', e => {
            if (isPickingTiles) return;
            switch(e.key) {
                case 'ArrowLeft': move('left'); e.preventDefault(); break;
                case 'ArrowRight': move('right'); e.preventDefault(); break;
                case 'ArrowUp': move('up'); e.preventDefault(); break;
                case 'ArrowDown': move('down'); e.preventDefault(); break;
            }
        });

        // Obsługa gestów dotykowych (Swipe)
        let touchStartX = 0;
        let touchStartY = 0;
        const gameContainer = document.getElementById('game-container');

        gameContainer.addEventListener('touchstart', e => {
            if (isPickingTiles) return;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        gameContainer.addEventListener('touchend', e => {
            if (isPickingTiles) return;
            let touchEndX = e.changedTouches[0].clientX;
            let touchEndY = e.changedTouches[0].clientY;

            let dx = touchEndX - touchStartX;
            let dy = touchEndY - touchStartY;

            if (Math.max(Math.abs(dx), Math.abs(dy)) > 30) {
                if (Math.abs(dx) > Math.abs(dy)) {
                    move(dx > 0 ? 'right' : 'left');
                } else {
                    move(dy > 0 ? 'down' : 'up');
                }
            }
        }, { passive: true });

        window.addEventListener('resize', render);

        // Uruchomienie gry
        initGame();
    </script>
</body>
</html>
