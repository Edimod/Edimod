<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edimod</title>
    
    <link rel="manifest" href="/Edimod/manifest.json">
    <link rel="icon" type="image/png" href="edimod-logo.png">
    <link rel="stylesheet" href="main.css">

    <style>
        /* Nagłówek i pasek górny */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: #000;
            z-index: 1000;
            display: flex;
            align-items: center;
            padding-left: 5px;
            gap: 20px;
        }

        /* Sekcja z kwadratowymi kartami na środku */
        .cards-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px; /* Odstęp między kwadratami */
            margin: 60px auto 40px auto; /* Marginesy dookoła sekcji */
            max-width: 600px;
            padding: 0 20px;
        }

        .main-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 140px;          /* Zmniejszony wymiar */
            height: 140px;         /* Idealny kwadrat */
            background-color: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            text-decoration: none;
            color: #2c3e50;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .main-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            border-color: #3498db;
            color: #3498db;
        }

        .card-icon {
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        /* Prawy górny guzik */
        .guzik-prawy-gorny {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 9999;
            background-color: #007bff;
            color: #ffffff;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-family: sans-serif;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.2s;
        }

        .guzik-prawy-gorny:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        /* Przeciągalny OC */
        .draggable-oc {
            position: absolute;
            bottom: 50px;
            right: 50px;
            width: 120px;
            height: auto;
            z-index: 9999;
            cursor: grab;
            user-select: none;
            -webkit-user-drag: none;
        }

        .draggable-oc:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" style="height: 50px; display: flex; align-items: center; gap: 10px; text-decoration: none; position: relative; z-index: 1001;">

            <span style="color: white; font-family: Arial, sans-serif; font-size: 24px; font-weight: bold;">Edimod</span>
        </a>
        <div class="dropdown">
            <button class="dropdown-btn">Linki :P<span class="arrow"></span></button>
            <div class="dropdown-content">
                <a href="https://discord.gg/wVfJD7RbCc" target="_blank">Dołącz do grupy Discord</a>
                <a href="https://github.com/Edimod" target="_blank">GitHub</a>
                <a href="https://www.youtube.com/@Edimodoficiall" target="_blank">YouTube</a>

                <a href="https://edimod.github.io/edimod2/" target="_blank">Produkty Edimod</a>
                <a href="https://m.youtube.com/shorts/jhKTD-392oc?is=bsYXGhq7hDuwu3F7" target="_blank">Nie klikaj zabraniam</a>
                <a href="EdiWeb.html" target="_blank">EdiWeb Beta</a>
            </div>
        </div>
    </header>
    <div class="welcome-container">
        <h1 id="welcome-text"></h1>
    </div>
    <div class="cards-container">
        <a href="gry.html" class="main-card">
            <span class="card-icon">🎮</span>
            <span>Gry</span>
        </a>
        <a href="https://edimod.github.io/edimod2/" class="main-card" target="_blank">
            <span class="card-icon">📦</span>
            <span>Produkty</span>

    </div>
