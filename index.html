<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edimod</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <!-- Czarny pasek -->
    <header style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 50px;
        background: #000;
        z-index: 1000;
        display: flex;
        align-items: center;
    ">
        <!-- Logo i nazwa prowadzące do strony głównej -->
        <a href="index.html" style="
            height: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-left: 5px;
            text-decoration: none;
            position: relative;
            z-index: 1001;
        ">
            <img src="edimod-logo.png" alt="Edimod" style="height: 50px; width: auto;">
            <span style="color: white; font-family: Arial, sans-serif; font-size: 24px; font-weight: bold;">Edimod</span>
        </a>
    </header>

    <!-- Napis na środku ekranu -->
    <div class="welcome-container">
        <h1 id="welcome-text"></h1>
    </div>

    <!-- Twój własny kursor -->
    <div class="custom-cursor site-wide"></div>

    <script src="main.js"></script>
</body>
</html>
