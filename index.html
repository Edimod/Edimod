<style>

        /* TUTAJ JEST CSS, KTÓRY PRZESUWA GUZIK */
        .guzik-prawy-gorny {
            position: fixed;   /* Przykleja guzik do ekranu */
            top: 10px;         /* Odstęp od samej góry */
            right: 10px;       /* Odstęp od prawej krawędzi */
            z-index: 9999;     /* Sprawia, że guzik jest na wierzchu */

            /* Styl wyglądu guzika */
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        .guzik-prawy-gorny:hover {
            background-color: #0056b3; /* Kolor po najechaniu myszką */
        }


.guzik-prawy-gorny {
  position: fixed;      /* Przykleja przycisk do ekranu w jednym miejscu */
  top: 20px;            /* Odstęp od górnej krawędzi ekranu */
  right: 20px;          /* Odstęp od prawej krawędzi ekranu */
  z-index: 9999;        /* Sprawia, że przycisk zawsze będzie na wierzchu i nic go nie zasłoni */

  /* Wygląd przycisku (możesz dowolnie zmieniać kolory) */
  background-color: #007bff; /* Niebieski kolor tła */
  color: #ffffff;            /* Biały kolor tekstu */
  padding: 12px 24px;        /* Wielkość przycisku (góra/dół, lewo/prawo) */
  text-decoration: none;     /* Usuwa podkreślenie linku */
  border-radius: 5px;        /* Lekkie zaokrąglenie rogów */
  font-family: sans-serif;   /* Prosty, nowoczesny font */
  font-weight: bold;         /* Pogrubiony tekst */
  box-shadow: 0 4px 6px rgba(0,0,0,0.1); /* Delikatny cień pod guzikiem */
  transition: 0.2s;          /* Płynne przejście przy najechaniu myszką */
}

/* Efekt po najechaniu myszką */
.guzik-prawy-gorny:hover {
  background-color: #0056b3; /* Ciemniejszy odcień niebieskiego */
  transform: scale(1.05);    /* Minimalne powiększenie guzika */
}


    .draggable-oc {
        position: absolute; /* Używamy absolute, żeby mógł swobodnie wędrować po stronie */
        bottom: 50px;
        right: 50px;
        width: 120px;
        height: auto;
        z-index: 9999;
        cursor: grab; /* Ładny kursor chwytania */
        user-select: none;
        -webkit-user-drag: none;
    }
    .draggable-oc:active {
        cursor: grabbing;
    }
</style>
