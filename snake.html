<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake</title>
    <!-- Tailwind CSS dla stylizacji interfejsu -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }

        /* Stylizowany suwak prędkości */
        input[type=range] {
            accent-color: #10b981;
        }

        /* Efekt świecenia dla planszy gry i węża */
        .glow-box {
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.15);
        }

        .glow-head {
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.8);
        }

        .glow-food {
            box-shadow: 0 0 12px rgba(244, 63, 94, 0.9);
        }

        /* Styl przycisków mobilnych */
        .btn-touch {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .btn-touch:active {
            transform: scale(0.92);
            background-color: #059669;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 selection:bg-emerald-500 selection:text-white">

    <!-- Nagłówek -->
    <header class="text-center my-2">
        <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight bg-gradient-to-r from-emerald-400 to-teal-200 bg-clip-text text-transparent drop-shadow">
            SNAKE
        </h1>
        <p class="text-xs md:text-sm text-slate-400 mt-1">spróbuj zapełnić całą mapę!</p>
    </header>

    <!-- Główna sekcja gry -->
    <main class="w-full max-w-4xl flex flex-col lg:flex-row items-center justify-center gap-6 my-auto">
        
        <!-- Panel Kontrolny / Ustawienia po lewej lub u góry -->
        <div class="bg-slate-900/80 border border-slate-800 backdrop-blur rounded-2xl p-5 w-full lg:w-72 flex flex-col gap-4 shadow-xl">
            <h2 class="text-lg font-bold text-emerald-400 border-b border-slate-800 pb-2">Ustawienia & Wyniki</h2>

            <!-- Wyniki -->
            <div class="grid grid-cols-2 gap-3 text-center">
                <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-2.5">
                    <span class="text-xs uppercase font-semibold text-slate-400 block">Wynik</span>
                    <span id="score" class="text-2xl font-black text-emerald-400">0</span>
                </div>
                <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-2.5">
                    <span class="text-xs uppercase font-semibold text-slate-400 block">Rekord</span>
                    <span id="high-score" class="text-2xl font-black text-amber-400">0</span>
                </div>
            </div>

            <!-- Kontrola Prędkości (Pokrętło / Suwak) -->
            <div class="space-y-1.5">
                <div class="flex justify-between items-center text-sm font-semibold">
                    <label for="speedSlider" class="text-slate-300">Prędkość gry:</label>
                    <span id="speedVal" class="text-emerald-400 font-bold">5 / 10</span>
                </div>
                <input type="range" id="speedSlider" min="1" max="10" value="5" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer">
                <div class="flex justify-between text-[10px] text-slate-500 uppercase font-bold">
                    <span>Powoli</span>
                    <span>Szybko</span>
                </div>
            </div>

            <!-- Wybór Rozmiaru Mapy -->
            <div class="space-y-1.5">
                <label for="mapSizeSelect" class="text-sm font-semibold text-slate-300 block">Rozmiar Mapy:</label>
                <select id="mapSizeSelect" class="w-full bg-slate-950 border border-slate-700 text-slate-200 rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:border-emerald-500 transition-colors">
                    <option value="10">Mała (10x10 - Łatwiej zapełnić)</option>
                    <option value="15" selected>Średnia (15x15 Standard)</option>
                    <option value="20">Duża (20x20 Klasyk)</option>
                    <option value="25">Ogromna (25x25 Ekstra wyzwanie)</option>
                </select>
            </div>

            <!-- Przyciski akcji -->
            <div class="pt-2 flex flex-col gap-2">
                <button id="btn-start" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-extrabold py-2.5 rounded-xl transition-all shadow-lg shadow-emerald-500/20 active:scale-95">
                    Start / Restart [Spacja]
                </button>
                <button id="btn-pause" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-2 rounded-xl transition-all border border-slate-700 text-sm">
                    Pauza [P]
                </button>
            </div>
        </div>

        <!-- Obszar gry Canvas -->
        <div class="relative flex flex-col items-center justify-center">
            <div class="relative rounded-2xl overflow-hidden border-2 border-emerald-500/40 glow-box bg-slate-900 shadow-2xl">
                <canvas id="gameCanvas" width="400" height="400" class="block max-w-full h-auto touch-none"></canvas>
                
                <!-- Nakładka stanu gry (Pauza / Koniec / Wygrana) -->
                <div id="overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-sm flex flex-col items-center justify-center text-center p-6 transition-opacity duration-300">
                    <div id="overlay-icon" class="text-5xl mb-3">🐍</div>
                    <h3 id="overlay-title" class="text-2xl font-extrabold text-white mb-2">Gotowy do gry?</h3>
                    <p id="overlay-desc" class="text-slate-300 text-sm max-w-xs mb-6">Naciśnij Start lub użyj strzałek, aby rozpocząć poruszanie się.</p>
                    <button id="overlay-btn" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold px-6 py-3 rounded-xl shadow-lg transition-transform active:scale-95">
                        ZAGRAJ TERAZ
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Sterowanie Dotykowe Mobilne -->
    <div class="w-full max-w-xs my-3 flex flex-col items-center gap-2">
        <div class="grid grid-cols-3 gap-2 w-48 h-48">
            <div></div>
            <button id="btn-up" class="btn-touch bg-slate-800 border border-slate-700 rounded-2xl flex items-center justify-center text-2xl text-emerald-400 font-black shadow-lg">▲</button>
            <div></div>

            <button id="btn-left" class="btn-touch bg-slate-800 border border-slate-700 rounded-2xl flex items-center justify-center text-2xl text-emerald-400 font-black shadow-lg">◄</button>
            <div class="flex items-center justify-center">
                <div class="w-3 h-3 rounded-full bg-emerald-500/30"></div>
            </div>
            <button id="btn-right" class="btn-touch bg-slate-800 border border-slate-700 rounded-2xl flex items-center justify-center text-2xl text-emerald-400 font-black shadow-lg">►</button>

            <div></div>
            <button id="btn-down" class="btn-touch bg-slate-800 border border-slate-700 rounded-2xl flex items-center justify-center text-2xl text-emerald-400 font-black shadow-lg">▼</button>
            <div></div>
        </div>
    </div>

    <!-- Stopka -->
    <footer class="text-center text-xs text-slate-500 mb-2">
        Edimod games© 2026
    </footer>

    <!-- Logika Gry JS -->
    <script>
        // Elementy DOM
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("high-score");
        const speedSlider = document.getElementById("speedSlider");
        const speedValDisplay = document.getElementById("speedVal");
        const mapSizeSelect = document.getElementById("mapSizeSelect");
        const btnStart = document.getElementById("btn-start");
        const btnPause = document.getElementById("btn-pause");

        // Elementy nakładki (Overlay)
        const overlay = document.getElementById("overlay");
        const overlayTitle = document.getElementById("overlay-title");
        const overlayDesc = document.getElementById("overlay-desc");
        const overlayIcon = document.getElementById("overlay-icon");
        const overlayBtn = document.getElementById("overlay-btn");

        // Zmienne stanu gry
        let tileCount = parseInt(mapSizeSelect.value); // Liczba pól w wierszu/kolumnie
        let gridSize = canvas.width / tileCount; // Rozmiar pojedynczego pola w pikselach
        
        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = 0;
        let dy = 0;
        let nextDx = 0;
        let nextDy = 0;

        let score = 0;
        let highScore = localStorage.getItem("snake_high_score") || 0;
        highScoreElement.textContent = highScore;

        let gameLoopTimeout = null;
        let isRunning = false;
        let isPaused = false;
        let speedLevel = parseInt(speedSlider.value);

        // Mapowanie poziomu prędkości na opóźnienie w milisekundach (1 = 220ms, 10 = 40ms)
        function getDelayFromSpeed(level) {
            return 240 - (level * 20);
        }

        // Aktualizacja rozmiaru canvasu oraz siatki
        function updateMapDimensions() {
            tileCount = parseInt(mapSizeSelect.value);
            gridSize = canvas.width / tileCount;
            if (!isRunning) {
                resetSnakeAndFood();
                draw();
            }
        }

        // Resetowanie pozycji węża i jedzenia
        function resetSnakeAndFood() {
            const startPos = Math.floor(tileCount / 2);
            snake = [
                { x: startPos, y: startPos },
                { x: startPos - 1, y: startPos },
                { x: startPos - 2, y: startPos }
            ];
            dx = 1; dy = 0;
            nextDx = 1; nextDy = 0;
            score = 0;
            scoreElement.textContent = score;
            spawnFood();
        }

        // Generowanie pożywienia na wolnym polu
        function spawnFood() {
            // Sprawdzenie czy wąż nie zajął całej mapy
            const totalTiles = tileCount * tileCount;
            if (snake.length >= totalTiles) {
                return; // Brak wolnych miejsc - gracz wygrał!
            }

            let validPosition = false;
            while (!validPosition) {
                food.x = Math.floor(Math.random() * tileCount);
                food.y = Math.floor(Math.random() * tileCount);
                
                // Sprawdzamy czy pozycja jedzenia nie koliduje z ciałem węża
                validPosition = !snake.some(segment => segment.x === food.x && segment.y === food.y);
            }
        }

        // Główna pętla gry
        function gameLoop() {
            if (!isRunning || isPaused) return;

            updateLogic();
            draw();

            // Kontynuacja pętli z aktualnym opóźnieniem ustawionym przez suwak prędkości
            const currentDelay = getDelayFromSpeed(speedLevel);
            gameLoopTimeout = setTimeout(gameLoop, currentDelay);
        }

        // Logika aktualizacji stanu gry (ruch, kolizje, wygrana)
        function updateLogic() {
            // Zastosuj zbuforowany kierunek
            dx = nextDx;
            dy = nextDy;

            // Wyznaczenie nowej głowy węża
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // 1. Sprawdzanie kolizji ze ścianami
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                triggerGameOver("Przegrana! Uderzyłeś w ścianę!");
                return;
            }

            // 2. Sprawdzanie kolizji ze samym sobą
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                triggerGameOver("Przegrana! Ugryzłeś własny ogon!");
                return;
            }

            // Dodanie nowej głowy
            snake.unshift(head);

            // 3. Sprawdzenie zjedzenia pokarmu
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;

                // Rekord
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.textContent = highScore;
                    localStorage.setItem("snake_high_score", highScore);
                }

                // 4. WARUNEK WYGRANEJ: Zapełnienie całej mapy!
                const totalTiles = tileCount * tileCount;
                if (snake.length === totalTiles) {
                    triggerGameWin();
                    return;
                }

                spawnFood();
            } else {
                // Usuwamy ogon, jeśli nie było jedzenia
                snake.pop();
            }
        }

        // Rysowanie grafiki na Canvas
        function draw() {
            // Tło planszy z delikatną siatką
            ctx.fillStyle = "#0f172a"; // Slate-900
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Rysowanie delikatnej siatki
            ctx.strokeStyle = "rgba(30, 41, 59, 0.5)"; // Slate-800
            ctx.lineWidth = 1;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // Rysowanie jedzenia (Czerwona pulsująca kropka)
            if (snake.length < tileCount * tileCount) {
                const foodPadding = 2;
                ctx.fillStyle = "#f43f5e"; // Rose-500
                ctx.beginPath();
                const radius = (gridSize / 2) - foodPadding;
                const centerX = food.x * gridSize + gridSize / 2;
                const centerY = food.y * gridSize + gridSize / 2;
                ctx.arc(centerX, centerY, radius > 0 ? radius : 2, 0, Math.PI * 2);
                ctx.fill();
            }

            // Rysowanie węża
            snake.forEach((segment, index) => {
                const isHead = index === 0;
                
                if (isHead) {
                    ctx.fillStyle = "#10b981"; // Głowa: Emerald-500
                } else {
                    // Gradacja koloru dla tułowia
                    ctx.fillStyle = index % 2 === 0 ? "#059669" : "#047857";
                }

                const pad = 1;
                const rx = segment.x * gridSize + pad;
                const ry = segment.y * gridSize + pad;
                const rw = gridSize - pad * 2;
                const rh = gridSize - pad * 2;

                // Zaokrąglone prostokąty dla segmentów
                ctx.beginPath();
                if (ctx.roundRect) {
                    ctx.roundRect(rx, ry, rw, rh, isHead ? 6 : 4);
                } else {
                    ctx.rect(rx, ry, rw, rh);
                }
                ctx.fill();

                // Oczy dla głowy węża
                if (isHead) {
                    ctx.fillStyle = "#022c22";
                    const eyeSize = Math.max(2, gridSize / 6);
                    let eye1X, eye1Y, eye2X, eye2Y;

                    if (dx === 1) { // Prawo
                        eye1X = rx + rw - eyeSize * 2; eye1Y = ry + eyeSize;
                        eye2X = rx + rw - eyeSize * 2; eye2Y = ry + rh - eyeSize * 2;
                    } else if (dx === -1) { // Lewo
                        eye1X = rx + eyeSize; eye1Y = ry + eyeSize;
                        eye2X = rx + eyeSize; eye2Y = ry + rh - eyeSize * 2;
                    } else if (dy === -1) { // Góra
                        eye1X = rx + eyeSize; eye1Y = ry + eyeSize;
                        eye2X = rx + rw - eyeSize * 2; eye2Y = ry + eyeSize;
                    } else { // Dół
                        eye1X = rx + eyeSize; eye1Y = ry + rh - eyeSize * 2;
                        eye2X = rx + rw - eyeSize * 2; eye2Y = ry + rh - eyeSize * 2;
                    }

                    ctx.fillRect(eye1X, eye1Y, eyeSize, eyeSize);
                    ctx.fillRect(eye2X, eye2Y, eyeSize, eyeSize);
                }
            });
        }

        // Wywołanie Wygranej
        function triggerGameWin() {
            isRunning = false;
            clearTimeout(gameLoopTimeout);
            showOverlay("👑 KRÓL SNAKEA! 👑", `NIESAMOWITE! Zapełniłeś całą mapę (${tileCount}x${tileCount})! Twoje zwycięstwo jest absolutne!`, "🏆");
        }

        // Wywołanie Przegranej
        function triggerGameOver(reason) {
            isRunning = false;
            clearTimeout(gameLoopTimeout);
            showOverlay("Koniec Gry!", `${reason} Twój wynik to: ${score}`, "💀");
        }

        // Pokazywanie nakładki informacyjnej
        function showOverlay(title, desc, icon = "🐍") {
            overlayTitle.textContent = title;
            overlayDesc.textContent = desc;
            overlayIcon.textContent = icon;
            overlay.classList.remove("opacity-0", "pointer-events-none");
            overlay.classList.add("opacity-100");
        }

        // Ukrywanie nakładki
        function hideOverlay() {
            overlay.classList.remove("opacity-100");
            overlay.classList.add("opacity-0", "pointer-events-none");
        }

        // Rozpoczęcie lub restart gry
        function startGame() {
            clearTimeout(gameLoopTimeout);
            resetSnakeAndFood();
            isRunning = true;
            isPaused = false;
            btnPause.textContent = "Pauza [P]";
            hideOverlay();
            gameLoop();
        }

        // Przełączanie pauzy
        function togglePause() {
            if (!isRunning) return;
            
            isPaused = !isPaused;
            if (isPaused) {
                btnPause.textContent = "Wznów [P]";
                showOverlay("Pauza", "Gra została wstrzymana.", "⏸️");
            } else {
                btnPause.textContent = "Pauza [P]";
                hideOverlay();
                gameLoop();
            }
        }

        // Zmiana kierunku (obsługa braku nawrotu 180 stopni)
        function setDirection(newDx, newDy) {
            if (!isRunning || isPaused) return;
            // Blokada ruchu w przeciwnym kierunku
            if (newDx === -dx && newDx !== 0) return;
            if (newDy === -dy && newDy !== 0) return;

            nextDx = newDx;
            nextDy = newDy;
        }

        // Nasłuchiwanie zdarzeń Klawiatury
        document.addEventListener("keydown", (e) => {
            const key = e.key.toLowerCase();
            
            if (key === "arrowup" || key === "w") {
                setDirection(0, -1);
            } else if (key === "arrowdown" || key === "s") {
                setDirection(0, 1);
            } else if (key === "arrowleft" || key === "a") {
                setDirection(-1, 0);
            } else if (key === "arrowright" || key === "d") {
                setDirection(1, 0);
            } else if (key === " " || key === "spacebar") {
                e.preventDefault();
                startGame();
            } else if (key === "p") {
                togglePause();
            }
        });

        // Nasłuchiwanie suwaka prędkości
        speedSlider.addEventListener("input", (e) => {
            speedLevel = parseInt(e.target.value);
            speedValDisplay.textContent = `${speedLevel} / 10`;
        });

        // Zmiana rozmiaru mapy
        mapSizeSelect.addEventListener("change", () => {
            if (isRunning) {
                if (confirm("Zmiana rozmiaru mapy zresetuje obecną grę. Kontynuować?")) {
                    isRunning = false;
                    clearTimeout(gameLoopTimeout);
                    updateMapDimensions();
                    showOverlay("Rozmiar Zmieniony", "Kliknij Start, aby zagrać na nowej mapie.", "📐");
                } else {
                    mapSizeSelect.value = tileCount; // Przywróć poprzedni wybór
                }
            } else {
                updateMapDimensions();
            }
        });

        // Przyciski ekranowe i dotykowe
        btnStart.addEventListener("click", startGame);
        btnPause.addEventListener("click", togglePause);
        overlayBtn.addEventListener("click", startGame);

        document.getElementById("btn-up").addEventListener("click", () => setDirection(0, -1));
        document.getElementById("btn-down").addEventListener("click", () => setDirection(0, 1));
        document.getElementById("btn-left").addEventListener("click", () => setDirection(-1, 0));
        document.getElementById("btn-right").addEventListener("click", () => setDirection(1, 0));

        // Inicjalizacja startowa po załadowaniu okna
        window.onload = () => {
            updateMapDimensions();
            draw();
        };
    </script>
</body>
</html>
