<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papier Kamień Nożyce Online</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MQTT.js -->
    <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
    <!-- Czcionka Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .fade-in {
            animation: fadeIn 0.25s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .choice-card {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .choice-card:hover:not(:disabled) {
            transform: translateY(-5px) scale(1.03);
        }
        .choice-card.selected {
            background-color: #fef3c7;
            border-color: #d97706;
            box-shadow: 0 10px 25px -5px rgba(217, 119, 6, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative overflow-x-hidden">

    <!-- LEWY GÓRNY RÓG: Nazwa konta oraz status -->
    <header class="fixed top-0 left-0 z-40 p-3 sm:p-4 flex flex-wrap items-center gap-3 max-w-full">
        <input
            type="text"
            id="my-name-input"
            maxlength="24"
            placeholder="Twoja nazwa konta"
            autocomplete="off"
            class="bg-white/95 backdrop-blur border border-gray-300 text-gray-800 text-sm sm:text-base font-medium rounded-xl px-3.5 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-600 focus:border-amber-600 w-44 sm:w-56 transition"
        />
        <div id="opponent-name-badge" class="hidden bg-amber-900 text-amber-50 text-sm sm:text-base font-semibold px-3.5 py-2 rounded-xl shadow-sm fade-in">
            Grasz z <span id="opponent-name-text" class="font-bold underline decoration-amber-400"></span>
        </div>
    </header>

    <!-- Komunikat / Toast -->
    <div id="toast-banner" class="hidden fixed top-16 left-1/2 -translate-x-1/2 z-50 text-white text-sm font-semibold px-5 py-2.5 rounded-xl shadow-lg transition-all text-center max-w-[92vw]">
        <span id="toast-message"></span>
    </div>

    <!-- GŁÓWNA PRZESTRZEŃ ROBOCZA -->
    <main class="flex-1 flex flex-col items-center justify-center p-4 pt-20 pb-12 w-full">

        <!-- EKRAN 1: STARTOWY -->
        <section id="screen-start" class="w-full max-w-xl flex flex-col items-center justify-center fade-in">
            <div class="flex items-center justify-center gap-4 sm:gap-5 mb-8 select-none">
                <div class="w-16 h-16 sm:w-20 sm:h-20 bg-amber-600 text-white border-2 border-amber-700 rounded-2xl shadow-md flex items-center justify-center text-3xl sm:text-4xl font-black">
                    ✊
                </div>
                <div class="flex flex-col leading-none text-left">
                    <span class="text-3xl sm:text-4xl font-black tracking-tight text-gray-900">Papier Kamień</span>
                    <span class="text-2xl sm:text-3xl font-extrabold tracking-wide text-amber-600 mt-1">Nożyce Online</span>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-4 w-full">
                <input
                    type="text"
                    id="join-code-input"
                    maxlength="10"
                    placeholder="Wpisz kod"
                    autocomplete="off"
                    class="w-full sm:w-48 text-center uppercase tracking-widest font-bold text-lg bg-white border-2 border-gray-300 text-gray-800 rounded-xl px-4 py-3 shadow-sm focus:outline-none focus:border-amber-600 focus:ring-2 focus:ring-amber-600/30 transition"
                />
                <span class="text-gray-500 font-semibold text-base sm:text-lg px-1 select-none">Albo</span>
                <button
                    id="btn-create-code"
                    type="button"
                    class="w-full sm:w-auto bg-amber-700 hover:bg-amber-800 active:scale-[0.98] text-white font-bold text-lg px-6 py-3 rounded-xl shadow-md transition cursor-pointer"
                >
                    Stwórz Kod
                </button>
            </div>

            <div id="join-button-wrapper" class="hidden mt-5 w-full sm:w-auto flex justify-center fade-in">
                <button
                    id="btn-join-game"
                    type="button"
                    class="w-full sm:w-56 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-bold text-lg px-8 py-3 rounded-xl shadow-md transition cursor-pointer"
                >
                    Dołącz
                </button>
            </div>
        </section>

        <!-- EKRAN 2: TYLKO KOD -->
        <section id="screen-code-only" class="hidden flex-col items-center justify-center text-center fade-in">
            <div
                id="generated-code-display"
                title="Kliknij, aby skopiować kod"
                class="text-6xl sm:text-8xl font-extrabold tracking-[0.18em] text-gray-900 bg-white border-2 border-gray-200 px-8 py-6 rounded-2xl shadow-md cursor-pointer hover:border-amber-500 active:scale-95 transition select-all"
            >
                ...
            </div>
            <p id="host-status-hint" class="mt-3 text-xs text-gray-400 font-medium transition-opacity">
                Rejestrowanie pokoju...
            </p>
        </section>

        <!-- EKRAN 3: GRA + SAFE CHAT -->
        <section id="screen-game" class="hidden flex-col lg:flex-row items-center lg:items-start justify-center gap-6 w-full max-w-5xl fade-in">

            <div class="flex flex-col items-center justify-center w-full max-w-xl">
                <!-- Tablica Wyników -->
                <div class="bg-white border border-gray-200 rounded-2xl p-4 shadow-sm w-full mb-5 flex items-center justify-around">
                    <div class="flex flex-col items-center">
                        <span class="text-xs font-bold uppercase tracking-wider text-gray-400">Ty</span>
                        <span id="my-score" class="text-3xl font-black text-amber-700">0</span>
                    </div>
                    <div class="text-2xl font-black text-gray-300">:</div>
                    <div class="flex flex-col items-center">
                        <span id="opponent-score-label" class="text-xs font-bold uppercase tracking-wider text-gray-400">Przeciwnik</span>
                        <span id="opponent-score" class="text-3xl font-black text-gray-700">0</span>
                    </div>
                </div>

                <!-- Status rundy -->
                <div id="round-status-box" class="w-full bg-amber-50 border border-amber-200 text-amber-900 font-bold text-center py-3 px-4 rounded-2xl shadow-sm mb-5 text-base sm:text-lg transition-all">
                    Wybierz swój ruch! (Do 3 wygranych)
                </div>

                <!-- Panel wyników pojedynczej rundy -->
                <div id="reveal-panel" class="hidden w-full bg-white border border-gray-200 rounded-2xl p-5 shadow-md mb-5 text-center fade-in">
                    <div class="flex items-center justify-around mb-3">
                        <div class="flex flex-col items-center">
                            <span class="text-xs text-gray-400 mb-1">Twój wybór</span>
                            <div id="reveal-my-choice" class="text-4xl">✊</div>
                        </div>
                        <span class="text-lg font-bold text-gray-300">VS</span>
                        <div class="flex flex-col items-center">
                            <span class="text-xs text-gray-400 mb-1">Przeciwnik</span>
                            <div id="reveal-opponent-choice" class="text-4xl">✋</div>
                        </div>
                    </div>
                    <div id="round-winner-text" class="text-xl font-black text-gray-900 mt-2">Remis w rundzie!</div>
                </div>

                <!-- Przyciski wyboru -->
                <div id="choices-container" class="grid grid-cols-3 gap-3 w-full">
                    <button type="button" data-choice="kamien" class="choice-card bg-white border-2 border-gray-200 hover:border-amber-600 rounded-2xl p-5 flex flex-col items-center justify-center shadow-sm cursor-pointer active:scale-95">
                        <span class="text-4xl sm:text-5xl mb-2">✊</span>
                        <span class="font-bold text-xs sm:text-sm text-gray-700">Kamień</span>
                    </button>
                    <button type="button" data-choice="papier" class="choice-card bg-white border-2 border-gray-200 hover:border-amber-600 rounded-2xl p-5 flex flex-col items-center justify-center shadow-sm cursor-pointer active:scale-95">
                        <span class="text-4xl sm:text-5xl mb-2">✋</span>
                        <span class="font-bold text-xs sm:text-sm text-gray-700">Papier</span>
                    </button>
                    <button type="button" data-choice="nozyce" class="choice-card bg-white border-2 border-gray-200 hover:border-amber-600 rounded-2xl p-5 flex flex-col items-center justify-center shadow-sm cursor-pointer active:scale-95">
                        <span class="text-4xl sm:text-5xl mb-2">✌️</span>
                        <span class="font-bold text-xs sm:text-sm text-gray-700">Nożyce</span>
                    </button>
                </div>

                <!-- Koniec meczu -->
                <div id="game-over-panel" class="hidden mt-5 bg-white border border-gray-200 rounded-2xl p-5 shadow-lg text-center max-w-sm w-full fade-in">
                    <h2 id="game-over-title" class="text-2xl font-extrabold text-gray-900 mb-1">Koniec meczu!</h2>
                    <p id="game-over-subtitle" class="text-sm text-gray-600 mb-4"></p>
                    <button
                        id="btn-play-again"
                        type="button"
                        class="w-full bg-amber-700 hover:bg-amber-800 active:scale-[0.98] text-white font-bold py-3 px-6 rounded-xl shadow transition cursor-pointer"
                    >
                        Zagraj ponownie
                    </button>
                </div>
            </div>

            <!-- SAFE CHAT -->
            <aside class="w-full max-w-md lg:w-72 bg-white border border-gray-200 rounded-2xl shadow-md p-4 flex flex-col lg:mt-12">
                <div class="flex items-center justify-between pb-2.5 mb-3 border-b border-gray-100">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                        <h3 class="text-sm font-extrabold uppercase tracking-wider text-gray-700">Safe Chat</h3>
                    </div>
                    <span class="text-[11px] font-semibold text-gray-400 bg-gray-100 px-2 py-0.5 rounded-md">Gotowe słowa</span>
                </div>
                <div id="safe-chat-messages" class="h-36 lg:h-52 overflow-y-auto flex flex-col gap-2 pr-1 mb-3 text-sm bg-gray-50 rounded-xl p-2.5 border border-gray-100">
                    <div class="text-xs text-gray-400 text-center my-auto select-none">Kliknij słowo poniżej, aby wysłać</div>
                </div>
                <div id="safe-chat-buttons" class="flex flex-wrap gap-1.5">
                    <button type="button" data-phrase="Hej" class="safe-chat-btn bg-gray-100 hover:bg-amber-100 active:scale-95 text-gray-800 font-semibold text-xs px-3 py-1.5 rounded-xl border border-gray-200 transition cursor-pointer">Hej</button>
                    <button type="button" data-phrase="Siema" class="safe-chat-btn bg-gray-100 hover:bg-amber-100 active:scale-95 text-gray-800 font-semibold text-xs px-3 py-1.5 rounded-xl border border-gray-200 transition cursor-pointer">Siema</button>
                    <button type="button" data-phrase="Nie" class="safe-chat-btn bg-gray-100 hover:bg-amber-100 active:scale-95 text-gray-800 font-semibold text-xs px-3 py-1.5 rounded-xl border border-gray-200 transition cursor-pointer">Nie</button>
                    <button type="button" data-phrase="Tak" class="safe-chat-btn bg-gray-100 hover:bg-amber-100 active:scale-95 text-gray-800 font-semibold text-xs px-3 py-1.5 rounded-xl border border-gray-200 transition cursor-pointer">Tak</button>
                    <button type="button" data-phrase="GG" class="safe-chat-btn bg-gray-100 hover:bg-amber-100 active:scale-95 text-gray-800 font-semibold text-xs px-3 py-1.5 rounded-xl border border-gray-200 transition cursor-pointer">GG</button>
                    <button type="button" data-phrase="xd" class="safe-chat-btn bg-gray-100 hover:bg-amber-100 active:scale-95 text-gray-800 font-semibold text-xs px-3 py-1.5 rounded-xl border border-gray-200 transition cursor-pointer">xd</button>
                    <button type="button" data-phrase="muszę kończyć" class="safe-chat-btn bg-gray-100 hover:bg-red-100 active:scale-95 text-gray-800 font-semibold text-xs px-3 py-1.5 rounded-xl border border-gray-200 transition cursor-pointer">muszę kończyć</button>
                </div>
            </aside>
        </section>
    </main>

    <footer class="w-full text-center py-3 text-xs text-gray-400 font-medium select-none">
        created by edimod
    </footer>

    <script>
        const TOPIC_PREFIX = 'edimod-pkn-2026/rooms/';
        const MQTT_BROKERS = [
            'wss://broker.emqx.io:8084/mqtt',
            'wss://broker.hivemq.com:8884/mqtt'
        ];
        const ALLOWED_SAFE_CHAT = ['Hej', 'Siema', 'Nie', 'Tak', 'GG', 'xd', 'muszę kończyć'];

        let mqttClient = null;
        let mqttConnected = false;
        let activeBrokerIndex = 0;
        let bc = null;
        let transportMode = null;
        const clientId = 'edimod_' + Math.random().toString(36).substring(2, 10) + '_' + Date.now().toString(36);

        let myRole = null;
        let roomCode = '';
        let opponentClientId = '';
        let opponentName = '';
        let isPaired = false;

        let joinTimeoutTimer = null;
        let heartbeatInterval = null;

        let myScore = 0;
        let opponentScore = 0;
        let myChoice = null;
        let opponentChoice = null;
        let roundResolved = false;
        let gameOver = false;

        const CHOICE_EMOJIS = {
            'kamien': '✊',
            'papier': '✋',
            'nozyce': '✌️'
        };

        const myNameInput = document.getElementById('my-name-input');
        const opponentNameBadge = document.getElementById('opponent-name-badge');
        const opponentNameText = document.getElementById('opponent-name-text');
        const toastBanner = document.getElementById('toast-banner');
        const toastMessage = document.getElementById('toast-message');

        const screenStart = document.getElementById('screen-start');
        const screenCodeOnly = document.getElementById('screen-code-only');
        const screenGame = document.getElementById('screen-game');

        const joinCodeInput = document.getElementById('join-code-input');
        const btnCreateCode = document.getElementById('btn-create-code');
        const joinButtonWrapper = document.getElementById('join-button-wrapper');
        const btnJoinGame = document.getElementById('btn-join-game');

        const generatedCodeDisplay = document.getElementById('generated-code-display');
        const hostStatusHint = document.getElementById('host-status-hint');

        const myScoreEl = document.getElementById('my-score');
        const opponentScoreEl = document.getElementById('opponent-score');
        const opponentScoreLabel = document.getElementById('opponent-score-label');
        const roundStatusBox = document.getElementById('round-status-box');
        const revealPanel = document.getElementById('reveal-panel');
        const revealMyChoice = document.getElementById('reveal-my-choice');
        const revealOpponentChoice = document.getElementById('reveal-opponent-choice');
        const roundWinnerText = document.getElementById('round-winner-text');
        const choiceButtons = document.querySelectorAll('.choice-card');

        const gameOverPanel = document.getElementById('game-over-panel');
        const gameOverTitle = document.getElementById('game-over-title');
        const gameOverSubtitle = document.getElementById('game-over-subtitle');
        const btnPlayAgain = document.getElementById('btn-play-again');

        const safeChatMessages = document.getElementById('safe-chat-messages');
        const safeChatButtons = document.querySelectorAll('.safe-chat-btn');

        function isTransportOpen() {
            if (!isPaired) return false;
            if (transportMode === 'local') return true;
            return Boolean(mqttClient && mqttConnected);
        }

        function publishRoomPacket(payload, forceMode = null) {
            const mode = forceMode || transportMode;
            const packet = {
                sender: clientId,
                to: opponentClientId || null,
                room: roomCode,
                payload: payload,
                ts: Date.now()
            };

            if (mode === 'local' || !mode) {
                if (bc) { try { bc.postMessage(packet); } catch (e) {} }
                try { localStorage.setItem('pkn_msg_' + roomCode, JSON.stringify(packet)); } catch (e) {}
            }

            if ((mode === 'mqtt' || !mode) && mqttClient && mqttConnected && roomCode) {
                try { mqttClient.publish(TOPIC_PREFIX + roomCode, JSON.stringify(packet), { qos: 1 }); } catch (e) {}
            }
        }

        function cleanupConnections() {
            clearTimeout(joinTimeoutTimer);
            clearInterval(heartbeatInterval);
            if (bc) { try { bc.close(); } catch (e) {} bc = null; }
            if (mqttClient) { try { mqttClient.end(true); } catch (e) {} mqttClient = null; }
            mqttConnected = false;
            isPaired = false;
            opponentClientId = '';
        }

        let toastTimeout = null;
        function showToast(msg, isError = true) {
            toastMessage.textContent = msg;
            toastBanner.className = `fixed top-16 left-1/2 -translate-x-1/2 z-50 text-white text-sm font-semibold px-5 py-2.5 rounded-xl shadow-lg transition-all text-center max-w-[92vw] ${isError ? 'bg-red-600' : 'bg-emerald-600'}`;
            toastBanner.classList.remove('hidden');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { toastBanner.classList.add('hidden'); }, 3800);
        }

        function updateOpponentNameUI() {
            const trimmed = (opponentName || '').trim();
            if (isPaired && trimmed.length > 0) {
                opponentNameText.textContent = trimmed;
                opponentScoreLabel.textContent = trimmed;
                opponentNameBadge.classList.remove('hidden');
            } else {
                opponentNameBadge.classList.add('hidden');
                opponentScoreLabel.textContent = 'Przeciwnik';
                opponentNameText.textContent = '';
            }
        }

        myNameInput.addEventListener('input', () => {
            if (isTransportOpen()) {
                publishRoomPacket({ type: 'NAME_UPDATE', name: myNameInput.value.trim() });
            }
        });

        function appendSafeChatMessage(phrase, isMine) {
            if (!ALLOWED_SAFE_CHAT.includes(phrase)) return;
            const placeholder = safeChatMessages.querySelector('.text-center');
            if (placeholder) placeholder.remove();

            const wrapper = document.createElement('div');
            wrapper.className = `flex flex-col ${isMine ? 'items-end' : 'items-start'} fade-in`;

            const senderLabel = document.createElement('span');
            senderLabel.className = 'text-[10px] font-semibold text-gray-400 mb-0.5 px-1';
            senderLabel.textContent = isMine ? 'Ty' : (opponentName.trim() || 'Przeciwnik');

            const bubble = document.createElement('div');
            bubble.className = isMine
                ? 'bg-amber-700 text-white font-semibold text-xs sm:text-sm px-3 py-1.5 rounded-2xl rounded-br-sm shadow-sm'
                : 'bg-white text-gray-800 font-semibold text-xs sm:text-sm px-3 py-1.5 rounded-2xl rounded-bl-sm border border-gray-200 shadow-sm';
            bubble.textContent = phrase;

            wrapper.appendChild(senderLabel);
            wrapper.appendChild(bubble);
            safeChatMessages.appendChild(wrapper);
            safeChatMessages.scrollTop = safeChatMessages.scrollHeight;
        }

        let chatCooldown = false;
        safeChatButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                if (chatCooldown || !isTransportOpen()) return;
                const phrase = btn.getAttribute('data-phrase');
                if (!ALLOWED_SAFE_CHAT.includes(phrase)) return;

                appendSafeChatMessage(phrase, true);
                publishRoomPacket({ type: 'SAFE_CHAT', phrase: phrase });
                chatCooldown = true;
                setTimeout(() => { chatCooldown = false; }, 700);
            });
        });

        function showScreen(screenName) {
            screenStart.classList.add('hidden');
            screenCodeOnly.classList.add('hidden');
            screenGame.classList.add('hidden');

            if (screenName === 'start') screenStart.classList.remove('hidden');
            else if (screenName === 'code') { screenCodeOnly.classList.remove('hidden'); screenCodeOnly.classList.add('flex'); }
            else if (screenName === 'game') { screenGame.classList.remove('hidden'); screenGame.classList.add('flex'); }
        }

        joinCodeInput.addEventListener('input', () => {
            if (joinCodeInput.value.trim().length > 0) joinButtonWrapper.classList.remove('hidden');
            else joinButtonWrapper.classList.add('hidden');
        });
        joinCodeInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && joinCodeInput.value.trim().length > 0) btnJoinGame.click();
        });

        function generateRoomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 5; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
            return code;
        }

        generatedCodeDisplay.addEventListener('click', () => {
            if (!roomCode || generatedCodeDisplay.textContent === '...') return;
            const tempInput = document.createElement('input');
            tempInput.value = roomCode;
            document.body.appendChild(tempInput);
            tempInput.select();
            try {
                document.execCommand('copy');
                hostStatusHint.textContent = 'Skopiowano kod do schowka!';
                hostStatusHint.className = 'mt-3 text-xs text-emerald-600 font-semibold transition-opacity';
                setTimeout(() => {
                    if (!isPaired) {
                        hostStatusHint.textContent = 'Gotowy – czekam na drugiego gracza';
                        hostStatusHint.className = 'mt-3 text-xs text-gray-400 font-medium transition-opacity';
                    }
                }, 2000);
            } catch (err) {}
            document.body.removeChild(tempInput);
        });

        function setupLocalChannel(code) {
            const channelName = 'pkn_room_' + code;
            const storageMsgKey = 'pkn_msg_' + code;

            if ('BroadcastChannel' in window) {
                bc = new BroadcastChannel(channelName);
                bc.onmessage = (event) => { handleIncomingPacket(event.data, 'local'); };
            }

            window.addEventListener('storage', (event) => {
                if (event.key === storageMsgKey && event.newValue) {
                    try {
                        const packet = JSON.parse(event.newValue);
                        handleIncomingPacket(packet, 'local');
                    } catch (e) {}
                }
            });
        }

        function connectMqttToRoom(code, onBrokerReady, onBrokerAllFailed) {
            if (typeof mqtt === 'undefined') {
                onBrokerAllFailed('Biblioteka sieciowa nie została załadowana.');
                return;
            }

            let brokerAttemptIndex = activeBrokerIndex;
            let attemptsCount = 0;

            const tryBroker = (idx) => {
                if (mqttClient) { try { mqttClient.end(true); } catch (e) {} mqttClient = null; }
                mqttConnected = false;

                const client = mqtt.connect(MQTT_BROKERS[idx], {
                    clientId: clientId,
                    clean: true,
                    connectTimeout: 5500,
                    reconnectPeriod: 2000,
                    keepalive: 25
                });
                mqttClient = client;
                let opened = false;

                client.on('connect', () => {
                    if (mqttClient !== client) return;
                    opened = true;
                    mqttConnected = true;
                    activeBrokerIndex = idx;
                    client.subscribe(TOPIC_PREFIX + code, { qos: 1 }, (err) => {
                        if (err) { onBrokerAllFailed('Błąd subskrypcji pokoju.'); return; }
                        if (onBrokerReady) onBrokerReady();
                    });
                });

                client.on('message', (topic, messageBuffer) => {
                    if (mqttClient !== client || topic !== TOPIC_PREFIX + code) return;
                    try {
                        const packet = JSON.parse(messageBuffer.toString());
                        handleIncomingPacket(packet, 'mqtt');
                    } catch (e) {}
                });

                client.on('error', () => {
                    if (mqttClient !== client) return;
                    if (!opened) {
                        try { client.end(true); } catch (e) {}
                        attemptsCount++;
                        if (attemptsCount < MQTT_BROKERS.length) tryBroker((idx + 1) % MQTT_BROKERS.length);
                        else if (!isPaired) onBrokerAllFailed('Brak połączenia z serwerem gry.');
                    }
                });
            };

            tryBroker(brokerAttemptIndex);
        }

        function handleIncomingPacket(packet, sourceMode) {
            if (!packet || packet.sender === clientId || packet.room !== roomCode) return;
            if (packet.to && packet.to !== clientId) return;

            const data = packet.payload;
            if (!data || typeof data !== 'object') return;

            if (myRole === 'host' && data.type === 'JOIN_REQUEST') {
                if (!isPaired) {
                    isPaired = true;
                    transportMode = sourceMode;
                    opponentClientId = packet.sender;
                    opponentName = data.name || '';
                    initGame();
                    publishRoomPacket({
                        type: 'WELCOME_SYNC',
                        myScore: opponentScore,
                        opponentScore: myScore,
                        name: myNameInput.value.trim()
                    }, sourceMode);
                    startHeartbeat();
                    updateOpponentNameUI();
                    startSyncedGameUI();
                }
                return;
            }

            if (myRole === 'guest' && !isPaired && data.type === 'WELCOME_SYNC') {
                isPaired = true;
                transportMode = sourceMode;
                opponentClientId = packet.sender;
                opponentName = data.name || '';
                clearTimeout(joinTimeoutTimer);
                joinCodeInput.value = '';
                joinButtonWrapper.classList.add('hidden');
                startHeartbeat();
                if (isTransportOpen()) {
                    publishRoomPacket({ type: 'NAME_UPDATE', name: myNameInput.value.trim() });
                }
                myScore = data.myScore;
                opponentScore = data.opponentScore;
                updateOpponentNameUI();
                startSyncedGameUI();
                return;
            }

            if (isPaired && packet.sender === opponentClientId) {
                handleIncomingGameData(data);
            }
        }

        function startHeartbeat() {
            clearInterval(heartbeatInterval);
            heartbeatInterval = setInterval(() => {
                if (isTransportOpen()) publishRoomPacket({ type: 'PING' });
            }, 5000);
        }

        btnCreateCode.addEventListener('click', () => {
            btnCreateCode.disabled = true;
            cleanupConnections();
            myRole = 'host';
            roomCode = generateRoomCode();
            generatedCodeDisplay.textContent = '...';
            hostStatusHint.textContent = 'Rejestrowanie pokoju...';
            showScreen('code');

            setupLocalChannel(roomCode);
            connectMqttToRoom(roomCode, () => {
                generatedCodeDisplay.textContent = roomCode;
                hostStatusHint.textContent = 'Kliknij kod, aby skopiować';
                btnCreateCode.disabled = false;
            }, (errMsg) => {
                generatedCodeDisplay.textContent = roomCode;
                hostStatusHint.textContent = errMsg;
                btnCreateCode.disabled = false;
            });
        });

        btnJoinGame.addEventListener('click', () => {
            const code = joinCodeInput.value.trim().toUpperCase();
            if (code.length < 3) {
                showToast('Wpisz poprawny kod pokoju!');
                return;
            }

            cleanupConnections();
            myRole = 'guest';
            roomCode = code;
            showToast('Łączenie z pokojem...', false);

            setupLocalChannel(roomCode);
            connectMqttToRoom(roomCode, () => {
                publishRoomPacket({
                    type: 'JOIN_REQUEST',
                    name: myNameInput.value.trim()
                });

                joinTimeoutTimer = setTimeout(() => {
                    if (!isPaired) {
                        showToast('Nie znaleziono pokoju lub gospodarz jest niedostępny.');
                        cleanupConnections();
                        showScreen('start');
                    }
                }, 6000);
            }, (errMsg) => {
                showToast(errMsg);
                showScreen('start');
            });
        });

        function initGame() {
            myScore = 0;
            opponentScore = 0;
            myChoice = null;
            opponentChoice = null;
            roundResolved = false;
            gameOver = false;

            myScoreEl.textContent = '0';
            opponentScoreEl.textContent = '0';
            roundStatusBox.textContent = 'Wybierz swój ruch! (Do 3 wygranych)';
            roundStatusBox.className = 'w-full bg-amber-50 border border-amber-200 text-amber-900 font-bold text-center py-3 px-4 rounded-2xl shadow-sm mb-5 text-base sm:text-lg transition-all';
            revealPanel.classList.add('hidden');
            gameOverPanel.classList.add('hidden');

            choiceButtons.forEach(btn => {
                btn.disabled = false;
                btn.classList.remove('selected', 'opacity-50', 'cursor-not-allowed');
            });
        }

        function startSyncedGameUI() {
            showScreen('game');
            initGame();
            showToast('Połączono z przeciwnikiem!', false);
        }

        choiceButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                if (roundResolved || gameOver || !isTransportOpen()) return;

                const choice = btn.getAttribute('data-choice');
                if (!choice) return;

                myChoice = choice;

                choiceButtons.forEach(b => {
                    b.classList.remove('selected');
                    b.classList.add('opacity-50', 'cursor-not-allowed');
                    b.disabled = true;
                });
                btn.classList.add('selected');
                btn.classList.remove('opacity-50', 'cursor-not-allowed');

                roundStatusBox.textContent = 'Czekam na ruch przeciwnika...';

                publishRoomPacket({
                    type: 'PLAYER_MOVE',
                    choice: myChoice
                });

                checkRoundCompletion();
            });
        });

        function handleIncomingGameData(data) {
            if (!data || typeof data !== 'object') return;

            if (data.type === 'PLAYER_MOVE') {
                opponentChoice = data.choice;
                checkRoundCompletion();
            } 
            else if (data.type === 'ROUND_SYNC') {
                applyRoundResultData(data);
            }
            else if (data.type === 'RESET_GAME') {
                initGame();
                showToast('Przeciwnik zresetował grę.', false);
            }
            else if (data.type === 'SAFE_CHAT') {
                appendSafeChatMessage(data.phrase, false);
            }
            else if (data.type === 'NAME_UPDATE') {
                opponentName = data.name || '';
                updateOpponentNameUI();
            }
        }

        function determineWinner(p1, p2) {
            if (p1 === p2) return 0;
            if (
                (p1 === 'kamien' && p2 === 'nozyce') ||
                (p1 === 'papier' && p2 === 'kamien') ||
                (p1 === 'nozyce' && p2 === 'papier')
            ) {
                return 1;
            }
            return -1;
        }

        function checkRoundCompletion() {
            if (myChoice && opponentChoice && !roundResolved) {
                roundResolved = true;

                revealMyChoice.textContent = CHOICE_EMOJIS[myChoice];
                revealOpponentChoice.textContent = CHOICE_EMOJIS[opponentChoice];
                revealPanel.classList.remove('hidden');

                let result = determineWinner(myChoice, opponentChoice);

                if (result === 1) {
                    myScore++;
                    roundWinnerText.textContent = 'Wygrywasz rundę!';
                    roundStatusBox.textContent = 'Punkt dla Ciebie!';
                    roundStatusBox.className = 'w-full bg-emerald-50 border border-emerald-200 text-emerald-900 font-bold text-center py-3 px-4 rounded-2xl shadow-sm mb-5 text-base sm:text-lg transition-all';
                } else if (result === -1) {
                    opponentScore++;
                    roundWinnerText.textContent = 'Przeciwnik wygrywa rundę!';
                    roundStatusBox.textContent = 'Punkt dla przeciwnika!';
                    roundStatusBox.className = 'w-full bg-red-50 border border-red-200 text-red-900 font-bold text-center py-3 px-4 rounded-2xl shadow-sm mb-5 text-base sm:text-lg transition-all';
                } else {
                    roundWinnerText.textContent = 'Remis w rundzie!';
                    roundStatusBox.textContent = 'Remis – powtórka rundy!';
                    roundStatusBox.className = 'w-full bg-amber-50 border border-amber-200 text-amber-900 font-bold text-center py-3 px-4 rounded-2xl shadow-sm mb-5 text-base sm:text-lg transition-all';
                }

                myScoreEl.textContent = myScore;
                opponentScoreEl.textContent = opponentScore;

                // Wysyłamy stan do przeciwnika ze zmienioną perspektywą punktów
                publishRoomPacket({
                    type: 'ROUND_SYNC',
                    myNewScore: opponentScore,
                    dataOpponentScore: myScore,
                    myChoice: opponentChoice,
                    opponentChoice: myChoice
                });

                if (myScore >= 3 || opponentScore >= 3) {
                    gameOver = true;
                    setTimeout(() => {
                        gameOverTitle.textContent = myScore >= 3 ? 'Zwycięstwo w meczu!' : 'Przegrana w meczu!';
                        gameOverSubtitle.textContent = myScore >= 3 ? 'Gratulacje, wygrałeś całą grę!' : 'Przeciwnik zdobył 3 punkty jako pierwszy.';
                        gameOverPanel.classList.remove('hidden');
                    }, 1000);
                } else {
                    setTimeout(() => {
                        if (!gameOver) {
                            myChoice = null;
                            opponentChoice = null;
                            roundResolved = false;
                            revealPanel.classList.add('hidden');
                            roundStatusBox.textContent = 'Wybierz swój ruch! (Do 3 wygranych)';
                            roundStatusBox.className = 'w-full bg-amber-50 border border-amber-200 text-amber-900 font-bold text-center py-3 px-4 rounded-2xl shadow-sm mb-5 text-base sm:text-lg transition-all';
                            
                            choiceButtons.forEach(b => {
                                b.disabled = false;
                                b.classList.remove('selected', 'opacity-50', 'cursor-not-allowed');
                            });
                        }
                    }, 2500);
                }
            }
        }

        function applyRoundResultData(data) {
            myScore = data.myNewScore;
            opponentScore = data.dataOpponentScore;
            myChoice = data.myChoice;
            opponentChoice = data.opponentChoice;

            myScoreEl.textContent = myScore;
            opponentScoreEl.textContent = opponentScore;

            revealMyChoice.textContent = CHOICE_EMOJIS[myChoice];
            revealOpponentChoice.textContent = CHOICE_EMOJIS[opponentChoice];
            revealPanel.classList.remove('hidden');
            roundResolved = true;

            let result = determineWinner(myChoice, opponentChoice);
            if (result === 1) {
                roundWinnerText.textContent = 'Wygrywasz rundę!';
                roundStatusBox.textContent = 'Punkt dla Ciebie!';
                roundStatusBox.className = 'w-full bg-emerald-50 border border-emerald-200 text-emerald-900 font-bold text-center py-3 px-4 rounded-2xl shadow-sm mb-5 text-base sm:text-lg transition-all';
            } else if (result === -1) {
                roundWinnerText.textContent = 'Przeciwnik wygrywa rundę!';
                roundStatusBox.textContent = 'Punkt dla przeciwnika!';
                roundStatusBox.className = 'w-full bg-red-50 border border-red-200 text-red-900 font-bold text-center py-3 px-4 rounded-2xl shadow-sm mb-5 text-base sm:text-lg transition-all';
            } else {
                roundWinnerText.textContent = 'Remis w rundzie!';
                roundStatusBox.textContent = 'Remis – powtórka rundy!';
                roundStatusBox.className = 'w-full bg-amber-50 border border-amber-200 text-amber-900 font-bold text-center py-3 px-4 rounded-2xl shadow-sm mb-5 text-base sm:text-lg transition-all';
            }

            if (myScore >= 3 || opponentScore >= 3) {
                gameOver = true;
                setTimeout(() => {
                    gameOverTitle.textContent = myScore >= 3 ? 'Zwycięstwo w meczu!' : 'Przegrana w meczu!';
                    gameOverSubtitle.textContent = myScore >= 3 ? 'Gratulacje, wygrałeś całą grę!' : 'Przeciwnik zdobył 3 punkty jako pierwszy.';
                    gameOverPanel.classList.remove('hidden');
                }, 1000);
            } else {
                setTimeout(() => {
                    if (!gameOver) {
                        myChoice = null;
                        opponentChoice = null;
                        roundResolved = false;
                        revealPanel.classList.add('hidden');
                        roundStatusBox.textContent = 'Wybierz swój ruch! (Do 3 wygranych)';
                        roundStatusBox.className = 'w-full bg-amber-50 border border-amber-200 text-amber-900 font-bold text-center py-3 px-4 rounded-2xl shadow-sm mb-5 text-base sm:text-lg transition-all';
                        
                        choiceButtons.forEach(b => {
                            b.disabled = false;
                            b.classList.remove('selected', 'opacity-50', 'cursor-not-allowed');
                        });
                    }
                }, 2500);
            }
        }

        btnPlayAgain.addEventListener('click', () => {
            initGame();
            publishRoomPacket({ type: 'RESET_GAME' });
        });
    </script>
</body>
</html>
