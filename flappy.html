<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Flappy Bird</title>
  <style>
    /* Reset i pełnoekranowe ciemne tło wyśrodkowujące portretowy ekran gry */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #12151c;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: "Courier New", Courier, monospace;
    }

    /* Kontener zachowujący proporcje 288:512 (9:16) w trybie portretowym */
    .game-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      max-width: calc(100vh * (288 / 512));
      max-height: calc(100vw * (512 / 288));
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.75), 0 0 0 2px rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      overflow: hidden;
      background: #4ec0ca;
    }

    /* Canvas o logicznej rozdzielczości 288x512 skalowany ostro */
    canvas#gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: pointer;
      touch-action: manipulation;
    }

    /* Przycisk wyciszania dźwięku w prawym górnym rogu ekranu gry */
    .sound-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 20;
      width: 34px;
      height: 34px;
      border-radius: 6px;
      border: 2px solid #2b1d0e;
      background: #f4e3b2;
      color: #2b1d0e;
      font-family: "Courier New", Courier, monospace;
      font-weight: 900;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 0 #b38b47, inset 0 2px 0 #fff8df;
      transition: transform 0.06s ease;
    }

    .sound-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #b38b47, inset 0 2px 0 #fff8df;
    }
  </style>
</head>
<body>
  <div class="game-wrapper" id="gameWrapper">
    <canvas id="gameCanvas" width="288" height="512"></canvas>
    <button class="sound-btn" id="soundToggle" type="button" aria-label="Przełącz dźwięk" title="Dźwięk: WŁ">
      SFX
    </button>
  </div>

  <script>
    (function () {
      "use strict";

      // =========================================================================
      // 1. STAŁE ORYGINAŁU (bazowa rozdzielczość 288x512, czas w sekundach)
      // =========================================================================
      const GAME_WIDTH = 288;
      const GAME_HEIGHT = 512;
      const GROUND_HEIGHT = 112;
      const PLAYABLE_HEIGHT = GAME_HEIGHT - GROUND_HEIGHT; // 400 px

      // Fizyka i ruch (wyrażone w pikselach/s oraz px/s^2 dla niezależności od FPS)
      const GRAVITY = 1480;          // przyspieszenie grawitacyjne w dół
      const FLAP_VELOCITY = -415;    // prędkość początkowa w górę przy skoku
      const MAX_FALL_SPEED = 560;    // maksymalna prędkość spadania
      const SCROLL_SPEED = 120;      // prędkość przesuwania rur i podłoża (px/s)

      // Parametry rur
      const PIPE_WIDTH = 52;
      const PIPE_CAP_HEIGHT = 24;
      const PIPE_CAP_OVERHANG = 3;
      const PIPE_GAP = 104;          // stały odstęp pionowy między górną a dolną rurą
      const PIPE_SPACING = 176;      // stały odstęp poziomy między środkami/początkami rur
      const MIN_PIPE_TOP = 44;       // minimalna wysokość górnej rury (bez kołnierza)
      const MAX_PIPE_TOP = PLAYABLE_HEIGHT - PIPE_GAP - 44; // maksymalna wysokość górnej rury

      // Parametry ptaka i wybaczającego hitboxa
      const BIRD_START_X = 76;
      const BIRD_START_Y = 236;
      const BIRD_DRAW_W = 34;
      const BIRD_DRAW_H = 24;
      const HITBOX_RADIUS = 9.5;     // lekko mniejszy niż wizualny kształt ptaka (jak w oryginale)

      // Klucz localStorage dla najlepszego wyniku
      const STORAGE_KEY = "flappy_bird_best_score_v1";

      // Stany maszyny stanów gry
      const STATE = {
        READY: "READY",
        PLAYING: "PLAYING",
        HIT_FALL: "HIT_FALL",
        GAME_OVER: "GAME_OVER"
      };

      // =========================================================================
      // 2. SYNTEZATOR DŹWIĘKÓW (Web Audio API - zero plików zewnętrznych)
      // =========================================================================
      class SoundEngine {
        constructor() {
          this.ctx = null;
          this.muted = false;
        }

        ensureContext() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              this.ctx = new AudioCtx();
            }
          }
          if (this.ctx && this.ctx.state === "suspended") {
            this.ctx.resume().catch(() => {});
          }
        }

        setMuted(mute) {
          this.muted = Boolean(mute);
        }

        toggleMute() {
          this.muted = !this.muted;
          if (!this.muted) {
            this.ensureContext();
          }
          return this.muted;
        }

        // Dźwięk machnięcia skrzydłem / skoku (wing)
        playWing() {
          if (this.muted) return;
          this.ensureContext();
          if (!this.ctx) return;

          try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = "triangle";
            osc.frequency.setValueAtTime(250, now);
            osc.frequency.exponentialRampToValueAtTime(560, now + 0.085);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.18, now + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.095);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + 0.1);
          } catch (_) {}
        }

        // Dźwięk zdobycia punktu (point - klasyczny dwutonowy interwał H5 -> E6)
        playPoint() {
          if (this.muted) return;
          this.ensureContext();
          if (!this.ctx) return;

          try {
            const now = this.ctx.currentTime;

            // Pierwszy ton (B5 / 987.77 Hz)
            const osc1 = this.ctx.createOscillator();
            const gain1 = this.ctx.createGain();
            osc1.type = "square";
            osc1.frequency.setValueAtTime(987.77, now);
            gain1.gain.setValueAtTime(0.11, now);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.085);
            osc1.connect(gain1);
            gain1.connect(this.ctx.destination);
            osc1.start(now);
            osc1.stop(now + 0.09);

            // Drugi ton (E6 / 1318.51 Hz)
            const osc2 = this.ctx.createOscillator();
            const gain2 = this.ctx.createGain();
            osc2.type = "square";
            osc2.frequency.setValueAtTime(1318.51, now + 0.075);
            gain2.gain.setValueAtTime(0.001, now);
            gain2.gain.setValueAtTime(0.11, now + 0.075);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
            osc2.connect(gain2);
            gain2.connect(this.ctx.destination);
            osc2.start(now + 0.075);
            osc2.stop(now + 0.33);
          } catch (_) {}
        }

        // Dźwięk uderzenia (hit - krótki szum + głuche uderzenie)
        playHit() {
          if (this.muted) return;
          this.ensureContext();
          if (!this.ctx) return;

          try {
            const now = this.ctx.currentTime;

            // Niskie uderzenie
            const osc = this.ctx.createOscillator();
            const oscGain = this.ctx.createGain();
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(165, now);
            osc.frequency.exponentialRampToValueAtTime(42, now + 0.14);

            oscGain.gain.setValueAtTime(0.24, now);
            oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

            osc.connect(oscGain);
            oscGain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.16);

            // Krótki biały szum uderzenia
            const bufferSize = Math.floor(this.ctx.sampleRate * 0.09);
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
              data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
            }

            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;

            const noiseGain = this.ctx.createGain();
            noiseGain.gain.setValueAtTime(0.22, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

            noise.connect(noiseGain);
            noiseGain.connect(this.ctx.destination);
            noise.start(now);
          } catch (_) {}
        }

        // Dźwięk upadku w dół (die - opadający gwizd/ton)
        playDie() {
          if (this.muted) return;
          this.ensureContext();
          if (!this.ctx) return;

          try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = "triangle";
            osc.frequency.setValueAtTime(420, now);
            osc.frequency.exponentialRampToValueAtTime(95, now + 0.34);

            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + 0.36);
          } catch (_) {}
        }
      }

      // =========================================================================
      // 3. STAN GRY I ZMIENNE ŚRODOWISKA
      // =========================================================================
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const soundBtn = document.getElementById("soundToggle");
      const sound = new SoundEngine();

      // Zapewnienie braku wygładzania pikseli na kontekście 2D
      ctx.imageSmoothingEnabled = false;

      let gameState = STATE.READY;
      let score = 0;
      let bestScore = loadBestScore();
      let isNewBest = false;

      // Przesunięcia paralaksy (w pikselach)
      let cloudScroll = 0;
      let cityScroll = 0;
      let bushScroll = 0;
      let groundScroll = 0;

      // Błysk ekranu przy uderzeniu (0.0 .. 1.0)
      let flashAlpha = 0;

      // Przejście ekranu podsumowania (animacja wysuwania tabliczki)
      let gameOverTimer = 0;
      let medalRevealProgress = 0;

      // Obiekt ptaka
      const bird = {
        x: BIRD_START_X,
        y: BIRD_START_Y,
        vy: 0,
        rotation: 0,          // w radianach
        wingTimer: 0,
        wingFrame: 1,         // 0: góra, 1: środek, 2: dół
        hoverTimer: 0,
        alive: true
      };

      // Lista aktywnych rur: { x, topHeight, passed }
      let pipes = [];

      // Prostokąt przycisku RESTART na ekranie podsumowania (w koordynatach 288x512)
      const restartButtonRect = {
        x: Math.floor((GAME_WIDTH - 104) / 2),
        y: 344,
        w: 104,
        h: 34
      };

      function loadBestScore() {
        try {
          const val = localStorage.getItem(STORAGE_KEY);
          const parsed = parseInt(val, 10);
          return Number.isFinite(parsed) && parsed >= 0 ? parsed : 0;
        } catch (_) {
          return 0;
        }
      }

      function saveBestScore(value) {
        try {
          localStorage.setItem(STORAGE_KEY, String(value));
        } catch (_) {}
      }

      // Resetuje grę do ekranu startowego (GET READY)
      function resetToReady() {
        gameState = STATE.READY;
        score = 0;
        isNewBest = false;
        flashAlpha = 0;
        gameOverTimer = 0;
        medalRevealProgress = 0;
        pipes = [];

        bird.x = BIRD_START_X;
        bird.y = BIRD_START_Y;
        bird.vy = 0;
        bird.rotation = 0;
        bird.wingTimer = 0;
        bird.wingFrame = 1;
        bird.hoverTimer = 0;
        bird.alive = true;
      }

      // Generuje losową wysokość górnej rury w dozwolonym zakresie
      function randomTopPipeHeight() {
        return Math.floor(
          MIN_PIPE_TOP + Math.random() * (MAX_PIPE_TOP - MIN_PIPE_TOP + 1)
        );
      }

      // Dodaje nową parę rur na wskazanej pozycji X
      function spawnPipeAt(xPos) {
        pipes.push({
          x: xPos,
          topHeight: randomTopPipeHeight(),
          passed: false
        });
      }

      // Rozpoczyna aktywną rozgrywkę z pierwszego skoku
      function startPlayingAndFlap() {
        gameState = STATE.PLAYING;
        pipes = [];
        // Pierwsza rura pojawia się po prawej stronie poza ekranem
        spawnPipeAt(GAME_WIDTH + 60);
        spawnPipeAt(GAME_WIDTH + 60 + PIPE_SPACING);
        spawnPipeAt(GAME_WIDTH + 60 + PIPE_SPACING * 2);
        flapBird();
      }

      // Wykonuje skok ptaka
      function flapBird() {
        if (!bird.alive) return;
        bird.vy = FLAP_VELOCITY;
        bird.rotation = -0.44; // ok. -25 stopni w górę
        bird.wingFrame = 0;
        bird.wingTimer = 0;
        sound.playWing();
      }

      // Przejście do stanu uderzenia (kolizja z rurą lub ziemią)
      function triggerHit(hitGroundDirectly) {
        if (!bird.alive) return;
        bird.alive = false;
        flashAlpha = 0.88;
        sound.playHit();

        // Aktualizacja najlepszego wyniku
        if (score > bestScore) {
          bestScore = score;
          isNewBest = true;
          saveBestScore(bestScore);
        }

        if (hitGroundDirectly) {
          bird.y = PLAYABLE_HEIGHT - HITBOX_RADIUS;
          bird.vy = 0;
          bird.rotation = Math.PI / 2;
          gameState = STATE.GAME_OVER;
          gameOverTimer = 0;
        } else {
          // Ptak spada na ziemię po uderzeniu w rurę w powietrzu
          bird.vy = -120; // lekkie podbicie przy uderzeniu jak w oryginale
          gameState = STATE.HIT_FALL;
          setTimeout(() => {
            if (gameState === STATE.HIT_FALL) {
              sound.playDie();
            }
          }, 120);
        }
      }

      // Przejście do ekranu GAME OVER po dotknięciu ziemi
      function enterGameOver() {
        bird.y = PLAYABLE_HEIGHT - HITBOX_RADIUS;
        bird.vy = 0;
        bird.rotation = Math.PI / 2;
        gameState = STATE.GAME_OVER;
        gameOverTimer = 0;
        medalRevealProgress = 0;
      }

      // =========================================================================
      // 4. LOGIKA FIZYKI I AKTUALIZACJI (60 FPS / Delta Time)
      // =========================================================================
      function update(dt) {
        // Zanikanie białego błysku kolizji
        if (flashAlpha > 0) {
          flashAlpha = Math.max(0, flashAlpha - dt * 4.2);
        }

        // Animacja skrzydeł (w READY i PLAYING ptak macha skrzydłami)
        if (gameState === STATE.READY || gameState === STATE.PLAYING) {
          bird.wingTimer += dt;
          const wingInterval = gameState === STATE.PLAYING ? 0.085 : 0.11;
          if (bird.wingTimer >= wingInterval) {
            bird.wingTimer -= wingInterval;
            bird.wingFrame = (bird.wingFrame + 1) % 3;
          }
        } else if (gameState === STATE.HIT_FALL || gameState === STATE.GAME_OVER) {
          bird.wingFrame = 1; // skrzydło złożone w neutralnej pozycji podczas upadku
        }

        if (gameState === STATE.READY) {
          // Przesuwanie chmur, miasta, krzaków i podłoża
          cloudScroll = (cloudScroll + SCROLL_SPEED * 0.14 * dt) % 288;
          cityScroll = (cityScroll + SCROLL_SPEED * 0.32 * dt) % 144;
          bushScroll = (bushScroll + SCROLL_SPEED * 0.65 * dt) % 96;
          groundScroll = (groundScroll + SCROLL_SPEED * dt) % 24;

          // Lewitowanie ptaka w miejscu (sinusoida)
          bird.hoverTimer += dt * 5.2;
          bird.y = BIRD_START_Y + Math.sin(bird.hoverTimer) * 6;
          bird.rotation = 0;
          return;
        }

        if (gameState === STATE.PLAYING) {
          // Ruch tła i podłoża
          cloudScroll = (cloudScroll + SCROLL_SPEED * 0.14 * dt) % 288;
          cityScroll = (cityScroll + SCROLL_SPEED * 0.32 * dt) % 144;
          bushScroll = (bushScroll + SCROLL_SPEED * 0.65 * dt) % 96;
          groundScroll = (groundScroll + SCROLL_SPEED * dt) % 24;

          // Fizyka grawitacji ptaka
          bird.vy = Math.min(MAX_FALL_SPEED, bird.vy + GRAVITY * dt);
          bird.y += bird.vy * dt;

          // Sufit: nie pozwalamy wylecieć poza górną krawędź ekranu
          if (bird.y < HITBOX_RADIUS) {
            bird.y = HITBOX_RADIUS;
            if (bird.vy < 0) bird.vy = 0;
          }

          // Płynne pochylanie dzioba: po skoku w górę, potem opadanie nosem w dół
          if (bird.vy < 110) {
            bird.rotation += (-0.44 - bird.rotation) * Math.min(1, dt * 16);
          } else {
            // Po osiągnięciu szczytu lotu ptak pochyla się w dół aż do ok. +82 stopni (+1.43 rad)
            const targetRot = Math.min(1.43, ((bird.vy - 110) / (MAX_FALL_SPEED - 110)) * 1.43);
            bird.rotation += (targetRot - bird.rotation) * Math.min(1, dt * 10);
          }

          // Ruch rur i sprawdzanie punktów + kolizji
          for (let i = pipes.length - 1; i >= 0; i--) {
            const pipe = pipes[i];
            pipe.x -= SCROLL_SPEED * dt;

            // Naliczanie punktu gdy środek ptaka minie środek rury
            if (!pipe.passed && pipe.x + PIPE_WIDTH / 2 < bird.x) {
              pipe.passed = true;
              score += 1;
              sound.playPoint();
            }

            // Kolizja ptaka (okrąg o promieniu HITBOX_RADIUS) z górną i dolną rurą
            if (checkCirclePipeCollision(bird.x, bird.y, HITBOX_RADIUS, pipe)) {
              triggerHit(false);
              break;
            }

            // Usuwanie rur, które zniknęły z lewej strony ekranu
            if (pipe.x + PIPE_WIDTH + PIPE_CAP_OVERHANG < -10) {
              pipes.splice(i, 1);
            }
          }

          // Utrzymywanie stałego odstępu poziomego między rurami
          if (gameState === STATE.PLAYING && pipes.length > 0) {
            const lastPipe = pipes[pipes.length - 1];
            if (lastPipe.x <= GAME_WIDTH - PIPE_SPACING) {
              spawnPipeAt(lastPipe.x + PIPE_SPACING);
            }
          }

          // Kolizja z podłożem
          if (gameState === STATE.PLAYING && bird.y + HITBOX_RADIUS >= PLAYABLE_HEIGHT) {
            triggerHit(true);
          }
          return;
        }

        if (gameState === STATE.HIT_FALL) {
          // Ptak spada pionowo na ziemię
          bird.vy = Math.min(MAX_FALL_SPEED * 1.1, bird.vy + GRAVITY * 1.15 * dt);
          bird.y += bird.vy * dt;
          bird.rotation = Math.min(Math.PI / 2, bird.rotation + dt * 6.5);

          if (bird.y + HITBOX_RADIUS >= PLAYABLE_HEIGHT) {
            enterGameOver();
          }
          return;
        }

        if (gameState === STATE.GAME_OVER) {
          gameOverTimer += dt;
          medalRevealProgress = Math.min(1, Math.max(0, (gameOverTimer - 0.25) / 0.35));
        }
      }

      // Wybaczająca kolizja okręgu (ptak) z prostokątami rur (trzon + kołnierz)
      function checkCirclePipeCollision(cx, cy, r, pipe) {
        const topPipeBottom = pipe.topHeight;
        const bottomPipeTop = pipe.topHeight + PIPE_GAP;

        // 1. Trzon górnej rury
        if (circleRectOverlap(cx, cy, r, pipe.x, 0, PIPE_WIDTH, topPipeBottom)) {
          return true;
        }
        // 2. Kołnierz górnej rury
        if (
          circleRectOverlap(
            cx,
            cy,
            r,
            pipe.x - PIPE_CAP_OVERHANG,
            topPipeBottom - PIPE_CAP_HEIGHT,
            PIPE_WIDTH + PIPE_CAP_OVERHANG * 2,
            PIPE_CAP_HEIGHT
          )
        ) {
          return true;
        }
        // 3. Trzon dolnej rury
        if (
          circleRectOverlap(
            cx,
            cy,
            r,
            pipe.x,
            bottomPipeTop,
            PIPE_WIDTH,
            PLAYABLE_HEIGHT - bottomPipeTop
          )
        ) {
          return true;
        }
        // 4. Kołnierz dolnej rury
        if (
          circleRectOverlap(
            cx,
            cy,
            r,
            pipe.x - PIPE_CAP_OVERHANG,
            bottomPipeTop,
            PIPE_WIDTH + PIPE_CAP_OVERHANG * 2,
            PIPE_CAP_HEIGHT
          )
        ) {
          return true;
        }

        return false;
      }

      function circleRectOverlap(cx, cy, r, rx, ry, rw, rh) {
        const closestX = Math.max(rx, Math.min(cx, rx + rw));
        const closestY = Math.max(ry, Math.min(cy, ry + rh));
        const dx = cx - closestX;
        const dy = cy - closestY;
        return dx * dx + dy * dy < r * r;
      }

      // =========================================================================
      // 5. RYSOWANIE NA CANVAS (Niebo, chmury, miasto, krzaki, rury, ziemia, ptak, UI)
      // =========================================================================
      function render() {
        ctx.save();
        ctx.imageSmoothingEnabled = false;

        // 1. Niebo (klasyczny błękit Flappy Bird)
        ctx.fillStyle = "#4ec0ca";
        ctx.fillRect(0, 0, GAME_WIDTH, PLAYABLE_HEIGHT);

        // Delikatny pas jaśniejszego nieba tuż nad horyzontem
        ctx.fillStyle = "#70d4dc";
        ctx.fillRect(0, PLAYABLE_HEIGHT - 125, GAME_WIDTH, 125);

        // 2. Chmury (przesuwane z paralaksą)
        drawClouds(Math.floor(cloudScroll));

        // 3. Sylwetka miasta w tle
        drawCity(Math.floor(cityScroll));

        // 4. Krzaki / zieleń tuż nad ziemią
        drawBushes(Math.floor(bushScroll));

        // 5. Zielone rury z kołnierzami
        for (let i = 0; i < pipes.length; i++) {
          drawPipePair(pipes[i]);
        }

        // 6. Przesuwające się pasiaste podłoże (ground)
        drawGround(Math.floor(groundScroll));

        // 7. Ptak z animacją skrzydeł i nachyleniem
        drawBird(bird);

        // 8. Interfejs i stany gry (READY, wynik na żywo, GAME OVER)
        if (gameState === STATE.READY) {
          drawReadyOverlay();
        } else if (gameState === STATE.PLAYING || gameState === STATE.HIT_FALL) {
          drawLiveScore(score);
        } else if (gameState === STATE.GAME_OVER) {
          drawGameOverPanel();
        }

        // 9. Błysk ekranu przy uderzeniu
        if (flashAlpha > 0) {
          ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha.toFixed(3)})`;
          ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        }

        ctx.restore();
      }

      // Rysowanie puszystych pixel-artowych chmur
      function drawClouds(scroll) {
        const patternW = 288;
        for (let offset = -patternW; offset <= patternW; offset += patternW) {
          const baseX = offset - scroll;
          drawCloudCluster(baseX + 22, 232, 1.0);
          drawCloudCluster(baseX + 128, 214, 0.85);
          drawCloudCluster(baseX + 224, 238, 1.05);
        }
      }

      function drawCloudCluster(x, y, scale) {
        ctx.fillStyle = "#e8f8f5";
        const w1 = Math.round(44 * scale);
        const h1 = Math.round(16 * scale);
        ctx.fillRect(x, y, w1, h1);
        ctx.fillRect(x + Math.round(8 * scale), y - Math.round(8 * scale), Math.round(24 * scale), Math.round(10 * scale));
        ctx.fillRect(x + Math.round(18 * scale), y - Math.round(12 * scale), Math.round(16 * scale), Math.round(6 * scale));

        // Cień pod chmurą
        ctx.fillStyle = "#bfe8e6";
        ctx.fillRect(x, y + h1 - 3, w1, 3);
      }

      // Rysowanie sylwetki miasta w tle
      function drawCity(scroll) {
        const tileW = 144;
        const buildings = [
          { dx: 0, w: 22, h: 52, c: "#a3e2c5", win: "#d5f5e3" },
          { dx: 20, w: 18, h: 68, c: "#8fd6b8", win: "#c8f0df" },
          { dx: 36, w: 26, h: 44, c: "#a3e2c5", win: "#d5f5e3" },
          { dx: 60, w: 20, h: 78, c: "#82cbb0", win: "#bef0dc" },
          { dx: 78, w: 24, h: 56, c: "#99dcc0", win: "#cff3e3" },
          { dx: 100, w: 18, h: 64, c: "#8fd6b8", win: "#c8f0df" },
          { dx: 116, w: 28, h: 48, c: "#a3e2c5", win: "#d5f5e3" }
        ];

        const baseGroundY = PLAYABLE_HEIGHT - 16;

        for (let rep = -1; rep <= 2; rep++) {
          const startX = rep * tileW - scroll;
          for (let i = 0; i < buildings.length; i++) {
            const b = buildings[i];
            const bx = Math.floor(startX + b.dx);
            const by = Math.floor(baseGroundY - b.h);

            ctx.fillStyle = b.c;
            ctx.fillRect(bx, by, b.w, b.h);

            // Małe okienka
            ctx.fillStyle = b.win;
            for (let wy = by + 6; wy < baseGroundY - 8; wy += 9) {
              for (let wx = bx + 4; wx < bx + b.w - 5; wx += 7) {
                ctx.fillRect(wx, wy, 3, 4);
              }
            }
          }
        }
      }

      // Rysowanie krzaków tuż nad ziemią
      function drawBushes(scroll) {
        const tileW = 96;
        const baseY = PLAYABLE_HEIGHT;

        for (let rep = -1; rep <= 3; rep++) {
          const sx = rep * tileW - scroll;
          const colors = ["#73bf2e", "#87d43c", "#9ce652"];

          for (let i = 0; i < 6; i++) {
            const bx = Math.floor(sx + i * 16);
            const bh = i % 2 === 0 ? 18 : 13;
            ctx.fillStyle = colors[i % colors.length];
            ctx.fillRect(bx, baseY - bh, 18, bh);
            ctx.fillRect(bx + 3, baseY - bh - 4, 12, 4);
          }
        }
      }

      // Rysowanie pojedynczej pary rur (górnej i dolnej) z cieniowaniem i kołnierzami
      function drawPipePair(pipe) {
        const x = Math.floor(pipe.x);
        const topH = Math.floor(pipe.topHeight);
        const bottomY = topH + PIPE_GAP;
        const bottomH = PLAYABLE_HEIGHT - bottomY;

        // Górna rura
        if (topH > 0) {
          const shaftH = Math.max(0, topH - PIPE_CAP_HEIGHT);
          drawPipeShaft(x, 0, PIPE_WIDTH, shaftH);
          drawPipeCap(
            x - PIPE_CAP_OVERHANG,
            Math.max(0, topH - PIPE_CAP_HEIGHT),
            PIPE_WIDTH + PIPE_CAP_OVERHANG * 2,
            Math.min(PIPE_CAP_HEIGHT, topH)
          );
        }

        // Dolna rura
        if (bottomH > 0) {
          const shaftY = bottomY + PIPE_CAP_HEIGHT;
          const shaftH = Math.max(0, PLAYABLE_HEIGHT - shaftY);
          drawPipeShaft(x, shaftY, PIPE_WIDTH, shaftH);
          drawPipeCap(
            x - PIPE_CAP_OVERHANG,
            bottomY,
            PIPE_WIDTH + PIPE_CAP_OVERHANG * 2,
            Math.min(PIPE_CAP_HEIGHT, bottomH)
          );
        }
      }

      // Trzon zielonej rury z klasycznym podświetleniem i cieniem
      function drawPipeShaft(x, y, w, h) {
        if (h <= 0) return;

        // Obrys czarny/ciemnozielony
        ctx.fillStyle = "#2b1d0e";
        ctx.fillRect(x, y, w, h);

        // Wnętrze z pasami jasnej i ciemnej zieleni (jak w oryginale)
        const ix = x + 2;
        const iw = w - 4;

        // Średnia zieleń
        ctx.fillStyle = "#73bf2e";
        ctx.fillRect(ix, y, iw, h);

        // Jasny połysk po lewej stronie
        ctx.fillStyle = "#9ce659";
        ctx.fillRect(ix + 2, y, 7, h);
        ctx.fillRect(ix + 11, y, 3, h);

        // Cień po prawej stronie
        ctx.fillStyle = "#558c22";
        ctx.fillRect(ix + iw - 9, y, 9, h);
        ctx.fillRect(ix + iw - 4, y, 4, h);
      }

      // Kołnierz rury z wyraźną krawędzią
      function drawPipeCap(x, y, w, h) {
        if (h <= 0) return;

        // Zewnętrzna ramka
        ctx.fillStyle = "#2b1d0e";
        ctx.fillRect(x, y, w, h);

        const ix = x + 2;
        const iy = y + 2;
        const iw = w - 4;
        const ih = Math.max(0, h - 4);

        if (ih > 0) {
          ctx.fillStyle = "#73bf2e";
          ctx.fillRect(ix, iy, iw, ih);

          // Jasny połysk
          ctx.fillStyle = "#9ce659";
          ctx.fillRect(ix + 2, iy, 8, ih);
          ctx.fillRect(ix + 12, iy, 3, ih);

          // Cień
          ctx.fillStyle = "#558c22";
          ctx.fillRect(ix + iw - 10, iy, 10, ih);
          ctx.fillRect(ix + iw - 4, iy, 4, ih);

          // Górny pasek rozświetlenia kołnierza
          ctx.fillStyle = "#b8f27c";
          ctx.fillRect(ix, iy, iw, 2);
        }
      }

      // Rysowanie przesuwającego się podłoża (górna krawędź trawy + ukośne paski + piasek)
      function drawGround(scroll) {
        const y = PLAYABLE_HEIGHT;

        // Górna ciemna linia podłoża
        ctx.fillStyle = "#2b1d0e";
        ctx.fillRect(0, y, GAME_WIDTH, 2);

        // Pas zielonej trawy (14 px)
        const grassY = y + 2;
        const grassH = 14;
        ctx.fillStyle = "#9ce659";
        ctx.fillRect(0, grassY, GAME_WIDTH, grassH);

        // Ukośne paski na trawie przesuwające się płynnie
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, grassY, GAME_WIDTH, grassH);
        ctx.clip();

        ctx.fillStyle = "#73bf2e";
        for (let sx = -48 - scroll; sx < GAME_WIDTH + 48; sx += 24) {
          ctx.beginPath();
          ctx.moveTo(sx, grassY + grassH);
          ctx.lineTo(sx + 10, grassY + grassH);
          ctx.lineTo(sx + 20, grassY);
          ctx.lineTo(sx + 10, grassY);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();

        // Linia oddzielająca trawę od piaszczystej ziemi
        ctx.fillStyle = "#54381e";
        ctx.fillRect(0, grassY + grassH, GAME_WIDTH, 3);

        // Piaskowe podłoże
        const sandY = grassY + grassH + 3;
        ctx.fillStyle = "#ded895";
        ctx.fillRect(0, sandY, GAME_WIDTH, GAME_HEIGHT - sandY);

        // Subtelne paski / tekstura piasku
        ctx.fillStyle = "#d0c874";
        for (let px = -24 - scroll; px < GAME_WIDTH + 24; px += 24) {
          ctx.fillRect(px + 4, sandY + 8, 10, 3);
          ctx.fillRect(px + 14, sandY + 24, 8, 3);
          ctx.fillRect(px + 2, sandY + 42, 12, 3);
        }
      }

      // Rysowanie ptaka z 3 klatkami skrzydła i obróconego wokół środka
      function drawBird(b) {
        ctx.save();
        ctx.translate(Math.round(b.x), Math.round(b.y));
        ctx.rotate(b.rotation);

        // Ciało ptaka (klasyczny żółty ptaszek z ciemnym obrysem)
        // Obrys
        ctx.fillStyle = "#2b1d0e";
        ctx.fillRect(-13, -10, 26, 20);
        ctx.fillRect(-15, -7, 30, 14);
        ctx.fillRect(-11, -12, 22, 24);

        // Główny żółty korpus
        ctx.fillStyle = "#f8d848";
        ctx.fillRect(-11, -10, 22, 20);
        ctx.fillRect(-13, -7, 26, 14);
        ctx.fillRect(-9, -11, 18, 22);

        // Jaśniejszy grzbiet
        ctx.fillStyle = "#fff199";
        ctx.fillRect(-9, -10, 14, 5);

        // Cieńszy dolny brzuszek
        ctx.fillStyle = "#e09c24";
        ctx.fillRect(-10, 5, 20, 5);

        // Oko (białe z czarną źrenicą)
        ctx.fillStyle = "#2b1d0e";
        ctx.fillRect(2, -9, 10, 10);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(3, -8, 8, 8);
        ctx.fillStyle = "#2b1d0e";
        ctx.fillRect(7, -6, 3, 4);

        // Dziób (pomarańczowo-czerwony)
        ctx.fillStyle = "#2b1d0e";
        ctx.fillRect(5, 0, 12, 8);
        ctx.fillStyle = "#f46828";
        ctx.fillRect(6, 1, 10, 3);
        ctx.fillStyle = "#d94514";
        ctx.fillRect(6, 4, 9, 3);

        // Skrzydło: 0 = w górze, 1 = w środku, 2 = w dole
        if (b.wingFrame === 0) {
          // Skrzydło uniesione w górę
          ctx.fillStyle = "#2b1d0e";
          ctx.fillRect(-12, -13, 12, 9);
          ctx.fillStyle = "#fff8d6";
          ctx.fillRect(-11, -12, 10, 4);
          ctx.fillStyle = "#f3c638";
          ctx.fillRect(-11, -8, 10, 3);
        } else if (b.wingFrame === 1) {
          // Skrzydło w pozycji środkowej
          ctx.fillStyle = "#2b1d0e";
          ctx.fillRect(-13, -3, 12, 8);
          ctx.fillStyle = "#fff8d6";
          ctx.fillRect(-12, -2, 10, 3);
          ctx.fillStyle = "#f3c638";
          ctx.fillRect(-12, 1, 10, 3);
        } else {
          // Skrzydło opuszczone w dół
          ctx.fillStyle = "#2b1d0e";
          ctx.fillRect(-12, 3, 12, 9);
          ctx.fillStyle = "#fff8d6";
          ctx.fillRect(-11, 4, 10, 3);
          ctx.fillStyle = "#f3c638";
          ctx.fillRect(-11, 7, 10, 4);
        }

        ctx.restore();
      }

      // Ekran startowy (GET READY + tytuł FLAPPY BIRD + instrukcja)
      function drawReadyOverlay() {
        // Duży tytuł FLAPPY BIRD
        drawOutlinedText("FLAPPY BIRD", GAME_WIDTH / 2, 88, 24, "#ffffff", "#2b1d0e", 3);

        // Napis GET READY
        drawOutlinedText("GET READY!", GAME_WIDTH / 2, 146, 17, "#73bf2e", "#2b1d0e", 2.5);

        // Ikona kliknięcia / spacji / dotyku pod ptakiem
        const pulse = Math.sin(bird.hoverTimer * 1.4) * 2;
        const tapBoxX = Math.floor(GAME_WIDTH / 2 - 66);
        const tapBoxY = Math.floor(296 + pulse);

        ctx.fillStyle = "rgba(43, 29, 14, 0.72)";
        roundRectPath(ctx, tapBoxX, tapBoxY, 132, 38, 6);
        ctx.fill();

        ctx.strokeStyle = "#f4e3b2";
        ctx.lineWidth = 2;
        roundRectPath(ctx, tapBoxX, tapBoxY, 132, 38, 6);
        ctx.stroke();

        ctx.fillStyle = "#fff8df";
        ctx.font = "bold 11px 'Courier New', Courier, monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("TAP / CLICK / SPACE", GAME_WIDTH / 2, tapBoxY + 13);

        ctx.fillStyle = "#f7d560";
        ctx.font = "bold 9px 'Courier New', Courier, monospace";
        ctx.fillText("SKOK W GÓRĘ", GAME_WIDTH / 2, tapBoxY + 27);
      }

      // Wynik na żywo na górze ekranu podczas gry
      function drawLiveScore(val) {
        drawOutlinedText(String(val), GAME_WIDTH / 2, 54, 34, "#ffffff", "#2b1d0e", 3.5);
      }

      // Ekran podsumowania (GAME OVER + tabliczka wyników + medal + przycisk RESTART)
      function drawGameOverPanel() {
        // Nagłówek GAME OVER
        drawOutlinedText("GAME OVER", GAME_WIDTH / 2, 92, 25, "#e86128", "#2b1d0e", 3);

        // Tabliczka wyników (beżowa w stylu oryginału z ciemnym obramowaniem)
        const cardX = 32;
        const cardY = 132;
        const cardW = GAME_WIDTH - 64; // 224
        const cardH = 132;

        ctx.fillStyle = "#2b1d0e";
        roundRectPath(ctx, cardX - 2, cardY - 2, cardW + 4, cardH + 4, 8);
        ctx.fill();

        ctx.fillStyle = "#ded895";
        roundRectPath(ctx, cardX, cardY, cardW, cardH, 6);
        ctx.fill();

        // Wewnętrzny cień i rozjaśnienie tabliczki
        ctx.fillStyle = "#efeac0";
        ctx.fillRect(cardX + 4, cardY + 4, cardW - 8, 5);

        const medalCenterX = cardX + 46;
        const medalCenterY = cardY + 68;
        const medalRadius = 22;

        // Wnęka na medal
        ctx.fillStyle = "#cbbd78";
        ctx.beginPath();
        ctx.arc(medalCenterX, medalCenterY, medalRadius, 0, Math.PI * 2);
        ctx.fill();

        const medalTier = getMedalTier(score);
        if (medalTier) {
          drawMedal(medalCenterX, medalCenterY, medalRadius - 2, medalTier, medalRevealProgress);
        }

        // Prawa strona tabliczki: SCORE oraz BEST

        ctx.textAlign = "right";
        ctx.textBaseline = "top";

        drawOutlinedText(String(score), cardX + cardW - 18, cardY + 38, 20, "#ffffff", "#2b1d0e", 2.5, "right");

        ctx.fillStyle = "#9e8645";
        ctx.font = "bold 11px 'Courier New', Courier, monospace";
        ctx.textAlign = "right";
        ctx.textBaseline = "top";
        ctx.fillText("BEST", cardX + cardW - 18, cardY + 70);

        drawOutlinedText(String(bestScore), cardX + cardW - 18, cardY + 92, 20, "#ffffff", "#2b1d0e", 2.5, "right");

        // Odznaka NEW przy najlepszym wyniku
        if (isNewBest && score > 0) {
          const badgeX = cardX + cardW - 64;
          const badgeY = cardY + 71;
          ctx.fillStyle = "#e84828";
          ctx.fillRect(badgeX, badgeY, 26, 11);
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 8px 'Courier New', Courier, monospace";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("NEW", badgeX + 13, badgeY + 6);
        }

        // Przycisk RESTART poniżej tabliczki
        const btn = restartButtonRect;
        ctx.fillStyle = "#2b1d0e";
        roundRectPath(ctx, btn.x - 2, btn.y - 2, btn.w + 4, btn.h + 4, 7);
        ctx.fill();

        ctx.fillStyle = "#e86128";
        roundRectPath(ctx, btn.x, btn.y, btn.w, btn.h, 5);
        ctx.fill();

        // Połysk górnej krawędzi przycisku
        ctx.fillStyle = "#ff8f54";
        ctx.fillRect(btn.x + 3, btn.y + 3, btn.w - 6, 6);

        // Cień dolnej krawędzi przycisku
        ctx.fillStyle = "#b54214";
        ctx.fillRect(btn.x + 3, btn.y + btn.h - 7, btn.w - 6, 4);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 14px 'Courier New', Courier, monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("RESTART", btn.x + btn.w / 2, btn.y + btn.h / 2 + 1);

        // Podpowiedź klawisza restartu
        ctx.fillStyle = "#2b1d0e";
        ctx.font = "bold 9px 'Courier New', Courier, monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        ctx.fillText("SPACJA / R / ENTER", GAME_WIDTH / 2, btn.y + btn.h + 10);
      }

      // Określa poziom medalu względem wyniku
      function getMedalTier(pts) {
        if (pts >= 40) return "PLATINUM";
        if (pts >= 30) return "GOLD";
        if (pts >= 20) return "SILVER";
        if (pts >= 10) return "BRONZE";
        return null;
      }

      // Rysowanie medalu (brązowy, srebrny, złoty, platynowy) + błysk gwiazdki
      function drawMedal(cx, cy, radius, tier, reveal) {
        const palettes = {
          BRONZE: { main: "#cd7f32", light: "#f0a860", dark: "#8c4e16", star: "#ffe0b2" },
          SILVER: { main: "#c0c8d0", light: "#eef4fa", dark: "#7a8490", star: "#ffffff" },
          GOLD: { main: "#f5c42e", light: "#fff08a", dark: "#b8820d", star: "#ffffff" },
          PLATINUM: { main: "#9be7ff", light: "#e8fbff", dark: "#469ab8", star: "#ffffff" }
        };
        const pal = palettes[tier] || palettes.BRONZE;

        ctx.save();
        ctx.translate(cx, cy);
        const scale = 0.4 + 0.6 * Math.min(1, reveal);
        ctx.scale(scale, scale);

        // Obramowanie medalu
        ctx.fillStyle = "#2b1d0e";
        ctx.beginPath();
        ctx.arc(0, 0, radius + 1.5, 0, Math.PI * 2);
        ctx.fill();

        // Główny krążek
        ctx.fillStyle = pal.main;
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fill();

        // Półcień po prawej/dole
        ctx.fillStyle = pal.dark;
        ctx.beginPath();
        ctx.arc(1.5, 1.5, radius - 2, -0.3, 1.9);
        ctx.fill();

        // Jasny akcent po lewej/górze
        ctx.fillStyle = pal.light;
        ctx.beginPath();
        ctx.arc(-1.5, -1.5, radius - 3, Math.PI * 0.8, Math.PI * 1.75);
        ctx.fill();

        // Gwiazdka w środku medalu
        ctx.fillStyle = pal.star;
        drawStar(ctx, 0, 0, 5, 7, 3);

        // Animowana iskierka dookoła medalu
        if (reveal >= 0.85) {
          const sparkPhase = (performance.now() / 320) % 4;
          const angles = [-0.8, 0.9, 2.5, -2.2];
          const idx = Math.floor(sparkPhase);
          const dist = radius + 4;
          const sx = Math.cos(angles[idx]) * dist;
          const sy = Math.sin(angles[idx]) * dist;
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(Math.round(sx) - 1, Math.round(sy) - 3, 3, 7);
          ctx.fillRect(Math.round(sx) - 3, Math.round(sy) - 1, 7, 3);
        }

        ctx.restore();
      }

      function drawStar(c, cx, cy, spikes, outerRadius, innerRadius) {
        let rot = (Math.PI / 2) * 3;
        const step = Math.PI / spikes;
        c.beginPath();
        c.moveTo(cx, cy - outerRadius);
        for (let i = 0; i < spikes; i++) {
          c.lineTo(cx + Math.cos(rot) * outerRadius, cy + Math.sin(rot) * outerRadius);
          rot += step;
          c.lineTo(cx + Math.cos(rot) * innerRadius, cy + Math.sin(rot) * innerRadius);
          rot += step;
        }
        c.closePath();
        c.fill();
      }

      // Tekst z wyraźnym czarnym obrysem i cieniem jak w oryginale
      function drawOutlinedText(text, x, y, size, fillColor, strokeColor, strokeWidth, align) {
        ctx.save();
        ctx.font = `900 ${size}px 'Courier New', Courier, monospace`;
        ctx.textAlign = align || "center";
        ctx.textBaseline = "middle";
        ctx.lineJoin = "round";

        // Lekki cień w dół
        ctx.fillStyle = strokeColor;
        ctx.fillText(text, x, y + 2);

        // Gruby obrys
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = strokeWidth * 2;
        ctx.strokeText(text, x, y);

        // Wypełnienie
        ctx.fillStyle = fillColor;
        ctx.fillText(text, x, y);
        ctx.restore();
      }

      function roundRectPath(c, x, y, w, h, r) {
        const radius = Math.min(r, w / 2, h / 2);
        c.beginPath();
        c.moveTo(x + radius, y);
        c.lineTo(x + w - radius, y);
        c.quadraticCurveTo(x + w, y, x + w, y + radius);
        c.lineTo(x + w, y + h - radius);
        c.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
        c.lineTo(x + radius, y + h);
        c.quadraticCurveTo(x, y + h, x, y + h - radius);
        c.lineTo(x, y + radius);
        c.quadraticCurveTo(x, y, x + radius, y);
        c.closePath();
      }

      // =========================================================================
      // 6. OBSŁUGA WEJŚCIA (Mysz, Dotyk, Klawiatura, Przycisk dźwięku)
      // =========================================================================
      function getCanvasPointFromClient(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        if (rect.width === 0 || rect.height === 0) return { x: 0, y: 0 };
        return {
          x: ((clientX - rect.left) / rect.width) * GAME_WIDTH,
          y: ((clientY - rect.top) / rect.height) * GAME_HEIGHT
        };
      }

      function isPointInRect(pt, r) {
        return pt.x >= r.x && pt.x <= r.x + r.w && pt.y >= r.y && pt.y <= r.y + r.h;
      }

      function handlePrimaryAction(canvasPt) {
        sound.ensureContext();

        if (gameState === STATE.READY) {
          startPlayingAndFlap();
          return;
        }

        if (gameState === STATE.PLAYING) {
          flapBird();
          return;
        }

        if (gameState === STATE.GAME_OVER) {
          // Pozwalamy na restart po krótkiej chwili (0.35s), aby przypadkowe kliknięcie tuż po upadku nie pominęło wyniku
          if (gameOverTimer >= 0.35) {
            if (!canvasPt || isPointInRect(canvasPt, restartButtonRect)) {
              resetToReady();
            }
          }
        }
      }

      // Obsługa myszy na canvasie
      canvas.addEventListener("pointerdown", function (e) {
        if (e.button !== undefined && e.button !== 0 && e.pointerType === "mouse") {
          return;
        }
        e.preventDefault();
        const pt = getCanvasPointFromClient(e.clientX, e.clientY);
        handlePrimaryAction(pt);
      });

      // Obsługa klawiatury: Spacja / ArrowUp do skoku, R / Enter do restartu w GAME OVER
      window.addEventListener("keydown", function (e) {
        if (e.repeat) return;

        if (e.code === "Space" || e.key === " " || e.key === "ArrowUp" || e.code === "ArrowUp") {
          e.preventDefault();
          sound.ensureContext();

          if (gameState === STATE.READY) {
            startPlayingAndFlap();
          } else if (gameState === STATE.PLAYING) {
            flapBird();
          } else if (gameState === STATE.GAME_OVER && gameOverTimer >= 0.35) {
            resetToReady();
          }
          return;
        }

        if (e.key === "r" || e.key === "R" || e.key === "Enter") {
          if (gameState === STATE.GAME_OVER && gameOverTimer >= 0.35) {
            e.preventDefault();
            resetToReady();
          }
        }
      });

      // Przycisk wyciszania dźwięku
      function updateSoundButtonUI() {
        soundBtn.textContent = sound.muted ? "MUTE" : "SFX";
        soundBtn.title = sound.muted ? "Dźwięk: WYŁ" : "Dźwięk: WŁ";
        soundBtn.style.opacity = sound.muted ? "0.75" : "1";
      }

      soundBtn.addEventListener("pointerdown", function (e) {
        e.stopPropagation();
      });

      soundBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        sound.toggleMute();
        updateSoundButtonUI();
      });

      // =========================================================================
      // 7. GŁÓWNA PĘTLA ANIMACJI (RequestAnimationFrame z bezpiecznym Delta Time)
      // =========================================================================
      let lastTimestamp = null;

      function gameLoop(timestamp) {
        if (lastTimestamp === null) {
          lastTimestamp = timestamp;
        }

        // Ograniczenie dt do maks. 0.05s (50 ms) na wypadek przełączenia karty przeglądarki
        const rawDt = (timestamp - lastTimestamp) / 1000;
        const dt = Math.min(0.05, Math.max(0, rawDt));
        lastTimestamp = timestamp;

        update(dt);
        render();

        window.requestAnimationFrame(gameLoop);
      }

      // Inicjalizacja stanu początkowego i start pętli
      updateSoundButtonUI();
      resetToReady();
      window.requestAnimationFrame(gameLoop);
    })();
  </script>
</body>
</html>
