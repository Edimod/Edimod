<head>
<meta charset="UTF-8">

<title>Gry</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #f4f6f9;
    color: #2c3e50;
    padding: 25px;
    font-family: "Comic Sans MS", cursive;
}

.games-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 25px;
    width: 100%;
}

.game-card {
    min-height: 220px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 15px;

    background: white;
    border: 2px solid #e0e0e0;
    border-radius: 18px;

    text-decoration: none;
    color: #2c3e50;

    font-family: "Comic Sans MS", cursive;
    font-size: 26px;
    font-weight: bold;

    box-shadow: 0 5px 12px rgba(0,0,0,0.06);
    transition: 0.2s;
}

.game-card:hover {
    transform: translateY(-5px);
    border-color: #3498db;
    color: #3498db;
    box-shadow: 0 10px 20px rgba(0,0,0,0.12);
}

.game-icon {
    font-size: 65px;
}

.footer {
    margin-top: 35px;
    text-align: center;
}

.btn-home {
    display: inline-block;
    padding: 14px 30px;
    background: #2c3e50;
    color: white;
    text-decoration: none;
    border-radius: 10px;
    font-size: 20px;
    font-weight: bold;
    transition: 0.2s;
}

.btn-home:hover {
    background: #1a252f;
}

@media (max-width: 700px) {
    .games-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .game-card {
        min-height: 170px;
        font-size: 20px;
    }

    .game-icon {
        font-size: 50px;
    }
}

@media (max-width: 400px) {
    .games-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
