<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gry</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            margin-bottom: 20px;
        }

        footer {
            margin-top: 40px;
        }

        .btn-home {
            display: inline-block;
            padding: 10px 20px;
            background-color: #2c3e50;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }

        .btn-home:hover {
            background-color: #1a252f;
        }

        .section-title {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 900px;
            width: 100%;
        }

        .game-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            aspect-ratio: 1 / 1;
            background-color: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            text-decoration: none;
            color: #2c3e50;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            border-color: #3498db;
            color: #3498db;
        }

        .game-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <header>
        <h1 class="section-title">Gry</h1>
    </header>

    <main>
        <div class="games-grid">

            <a href="UNDERTALE.html" class="game-card">
                <span class="game-icon">❤️</span>
                <span>Undertale</span>
            </a>
            
            <a href="zgadywanki.html" class="game-card">
                <span class="game-icon">❓</span>
                <span>Zgadywanki</span>
            </a>

            <a href="snake.html" class="game-card">
                <span class="game-icon">🐍</span>
                <span>Snake</span>
            </a>



            <a href="2048.html" class="game-card">
                <span class="game-icon">🧩</span>
                <span>2048</span>
            </a>

            <a href="tictactoe.html" class="game-card">
                <span class="game-icon">✖️</span>
                <span>Kółko i krzyżyk</span>
            </a>

            <a href="warcaby.html" class="game-card">
                <span class="game-icon">♟️</span>
                <span>Warcaby</span>
            </a>
            
            <a href="mineswweper.html" class="game-card">
                <span class="game-icon">⛳</span>
                <span>Mineswweper</span>
            </a>

            <a href="flappy.html" class="game-card">
                <span class="game-icon">🦆</span>
                <span>Flappy Bird</span>
            </a>            

            <a href="pkn.html" class="game-card">
                <span class="game-icon">📃</span>
                <span>Papier Kamień Nożyce</span>
</a>
            
            <a href="widelec.html" class="game-card">
                <span class="game-icon">🇵🇱</span>
                <span>Wisielec</span>
            </a>            

            <a href="uno.html" class="game-card">
                <span class="game-icon">💳</span>
                <span>Uno</span>
            </a>              

            <a href="pas.html" class="game-card">
                <span class="game-icon">♠️</span>
                <span>Pasjans</span>
            </a>

            <a href="kasyno.html" class="game-card">
                <span class="game-icon">💵💵💵</span>
                <span>Kasyno</span>
            </a>

            <a href="Minecraft.html" class="game-card">
                <span class="game-icon">⚒️</span>
                <span>Minecraft 2D</span>
            </a>            
            
        </div>
    </main>

    <footer>
        <a href="index.html" class="btn-home">← Strona główna</a>
    </footer>

</body>
</html>
